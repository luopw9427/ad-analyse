<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>素材生成</title>
<style>
  :root{
    --bg:#eef2f8; --panel:#ffffff; --panel-2:#f7f9fc;
    --ink:#1b2431; --sub:#5a6678; --muted:#9aa6b6;
    --line:#e7ecf3; --line-2:#dde4ee;
    --accent:#2f6bed; --accent-ink:#1e51c4; --accent-weak:#eaf1fe;
    --ok:#15a34a; --ok-bg:#e9f7ee; --warn:#c26a12; --warn-bg:#fbf1e2;
    --run:#5a52d8; --run-bg:#eeecfb; --sell:#0e7490; --sell-bg:#e0f2f7;
    --r:14px; --r-sm:9px; --rail-w:56px; --pick-w:400px; --dt-w:520px; --panel-w:430px;
    --sh:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.05);
    --sh-sm:0 1px 2px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;background:#edf1f7;color:var(--ink);
    font-family:-apple-system,"Segoe UI",system-ui,"Microsoft YaHei",sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}

  /* 窄左栏 */
  #rail{position:fixed;left:0;top:0;bottom:0;width:var(--rail-w);z-index:50;
    background:#0f1830;display:flex;flex-direction:column;gap:3px;padding:10px 8px;
    transition:width .2s ease;overflow:hidden}
  body.rail-open{--rail-w:196px}
  .rail-toggle{background:transparent;border:0;color:#8f9bb3;cursor:pointer;padding:9px;
    border-radius:9px;display:flex;align-items:center;margin-bottom:6px}
  .rail-toggle:hover{background:rgba(255,255,255,.08);color:#fff}
  .rail-item{display:flex;align-items:center;gap:13px;color:#aeb8cc;text-decoration:none;
    padding:11px 10px;border-radius:10px;white-space:nowrap;font-weight:600;font-size:13px}
  .rail-item:hover{background:rgba(255,255,255,.08);color:#fff}
  .rail-item.active{background:linear-gradient(90deg,#2f6bed,#5a52d8);color:#fff}
  .rail-item svg{flex:0 0 20px}
  .rail-item span,.rail-sub span{opacity:0;transition:opacity .15s}
  body.rail-open .rail-item span,body.rail-open .rail-sub span{opacity:1}
  /* 子模块：明显缩进，低一级 */
  .rail-subs{display:flex;flex-direction:column;gap:2px;margin:2px 0 6px 20px;
    padding-left:8px;border-left:1px solid rgba(255,255,255,.09)}
  body:not(.rail-open) .rail-subs{margin-left:8px;border-left:0}
  .rail-sub{display:flex;align-items:center;gap:10px;color:#8c98b3;text-decoration:none;
    padding:7px 9px;border-radius:8px;white-space:nowrap;font-size:12px;font-weight:600}
  .rail-sub:hover{background:rgba(255,255,255,.06);color:#e6ebf5}
  .rail-sub.active{color:#fff;background:rgba(47,107,237,.26)}
  .rail-sub svg{flex:0 0 16px}
  .rail-sp{flex:1 1 auto}
  .rail-brand{color:#5f6b85;font-size:11px;text-align:center;padding:6px 0;white-space:nowrap;opacity:0}
  body.rail-open .rail-brand{opacity:1}

  header{padding:12px 24px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap;
    position:fixed;top:0;left:var(--rail-w);right:0;z-index:40;transition:left .2s ease}
  header h1{font-size:16px;margin:0 8px 0 0;font-weight:700;
    background:linear-gradient(90deg,#2f6bed,#5a52d8);-webkit-background-clip:text;background-clip:text;color:transparent}
  .muted{color:var(--sub)}
  .chip{border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;background:var(--accent-weak);color:var(--accent-ink)}
  .chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
  .modechip{font-size:12px;color:var(--accent-ink);background:var(--accent-weak);border-radius:999px;padding:4px 13px;font-weight:600}

  input,select,textarea{background:#fff;border:1px solid var(--line-2);color:var(--ink);
    padding:9px 11px;border-radius:var(--r-sm);font-size:13px;outline:none;transition:.15s;font-family:inherit}
  textarea{width:100%;min-height:130px;resize:vertical;line-height:1.65}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
  button{background:#fff;border:1px solid var(--line-2);color:var(--sub);padding:8px 14px;border-radius:var(--r-sm);
    cursor:pointer;font-size:13px;font-weight:600;transition:.15s;box-shadow:var(--sh-sm)}
  button:hover{background:var(--accent-weak);color:var(--accent);border-color:var(--accent)}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.soft{background:var(--accent-weak);color:var(--accent-ink);border-color:transparent}

  #scroll{position:fixed;left:var(--rail-w);right:0;top:var(--hdr-h,56px);bottom:0;transition:left .2s ease}
  .studio{display:flex;height:100%}
  .gen-panel{flex:0 0 var(--panel-w);width:var(--panel-w);overflow-y:auto;background:var(--panel);
    border-right:1px solid var(--line);padding:20px 22px 60px}
  .results{flex:1;overflow-y:auto;padding:16px 22px 40px;transition:margin-right .24s ease;background:#eef2f8}
  body.pick-open .results{margin-right:calc(var(--pick-w) + 4px)}
  .res-hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .res-hd .ttl{font-size:15px;font-weight:700}

  /* 分区标题 */
  .lab{font-size:12px;color:var(--sub);font-weight:700;margin:18px 0 8px;display:flex;justify-content:space-between;align-items:center}
  .lab:first-of-type{margin-top:0}
  .req{color:#d64545}

  /* 模型自定义下拉（图2 那种）*/
  .mi{width:38px;height:38px;border-radius:10px;flex:0 0 38px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#2f6bed,#8a5cf6);color:#fff}
  .mdd{position:relative}
  .mdd-head{display:flex;align-items:center;gap:12px;border:1px solid var(--line-2);border-radius:12px;
    padding:11px 14px;background:var(--panel-2);cursor:pointer;transition:.15s}
  .mdd-head:hover{border-color:var(--accent)}
  .mdd-name{flex:1;min-width:0;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mdd-head .chev{color:var(--muted);transition:transform .2s}
  .mdd.open .chev{transform:rotate(180deg)}
  .mdd-pop{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);
    border-radius:12px;box-shadow:var(--sh);padding:6px;z-index:30;display:none;max-height:320px;overflow:auto}
  .mdd.open .mdd-pop{display:block}
  .mdd-opt{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;cursor:pointer}
  .mdd-opt:hover{background:var(--panel-2)}
  .mdd-opt.on{background:var(--accent-weak)}
  .mdd-opt .mi2{width:26px;height:26px;border-radius:7px;flex:0 0 26px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#2f6bed,#8a5cf6);color:#fff}
  .mdd-opt .nm{flex:1;font-size:13.5px;font-weight:600}
  .mdd-opt .ck{color:var(--accent);opacity:0}.mdd-opt.on .ck{opacity:1}

  /* 版本卡（Normal / Fast）*/
  .vercards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .vercard{display:flex;align-items:center;gap:11px;border:1.5px solid var(--line-2);border-radius:12px;
    padding:13px 12px;cursor:pointer;transition:.15s;position:relative}
  .vercard:hover{border-color:var(--accent)}
  .vercard.on{border-color:var(--accent);background:var(--accent-weak)}
  .vercard .vi{width:32px;height:32px;border-radius:9px;flex:0 0 32px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#2f6bed,#8a5cf6);color:#fff}
  .vercard b{font-size:13.5px;font-weight:700}
  .vercard .rd{position:absolute;top:10px;right:10px;width:15px;height:15px;border-radius:50%;border:2px solid var(--line-2);background:#fff}
  .vercard.on .rd{border-color:var(--accent);background:var(--accent);box-shadow:inset 0 0 0 3px #fff}

  /* 参数按钮组（图4 那种）*/
  .bgroup{display:flex;gap:8px;flex-wrap:wrap}
  .bopt{border:1px solid var(--line-2);background:#fff;border-radius:9px;padding:8px 15px;font-size:13px;font-weight:600;
    color:var(--sub);cursor:pointer;transition:.15s;box-shadow:none}
  .bopt:hover{border-color:var(--accent);color:var(--accent)}
  .bopt.on{background:var(--accent);border-color:var(--accent);color:#fff}

  /* 参考图上传区 */
  .refzone{border:1px dashed var(--line-2);border-radius:11px;padding:12px;transition:.15s}
  .refzone.drag{border-color:var(--accent);background:var(--accent-weak)}
  .refgrid{display:flex;gap:8px;flex-wrap:wrap}
  .refgrid:empty{display:none}
  .refthumb{position:relative;width:66px;height:66px;border-radius:9px;overflow:hidden;border:1px solid var(--line-2);background:#0c1222}
  .refthumb img{width:100%;height:100%;object-fit:cover}
  .refthumb .rm{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;
    border:0;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer;padding:0;box-shadow:none}
  .refthumb .first{position:absolute;bottom:0;left:0;right:0;background:rgba(47,107,237,.85);color:#fff;font-size:9px;text-align:center;padding:1px 0}
  .refthumb.up{display:flex;align-items:center;justify-content:center;color:#6b7796;font-size:11px}
  .refadd{display:flex;align-items:center;gap:8px;justify-content:center;color:var(--sub);font-size:12px;font-weight:600;
    padding:12px;margin-top:8px;border:1px solid var(--line-2);border-radius:9px;cursor:pointer;transition:.15s}
  .refgrid:empty + .refadd{margin-top:0}
  .refadd:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-weak)}
  .ptools{display:flex;gap:8px}.ptools button{padding:5px 10px;font-size:12px}
  .srcbar{display:none;align-items:center;gap:8px;background:var(--sell-bg);color:var(--sell);
    border-radius:9px;padding:7px 10px;font-size:12px;margin-bottom:8px}
  .srcbar.on{display:flex}.srcbar .x{margin-left:auto;cursor:pointer;font-weight:700}
  .taWrap{position:relative}.cc{position:absolute;right:10px;bottom:8px;font-size:11px;color:var(--muted)}
  .verbar{font-size:12px;color:var(--sub);margin:8px 0 0;display:none;align-items:center;gap:8px}
  .verbar.on{display:flex}.verbar .lnk{color:var(--accent);cursor:pointer;font-weight:600}
  .vlist{display:none;margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--panel-2)}
  .vlist.on{display:block}
  .vrow{border-bottom:1px dashed var(--line-2);padding:7px 4px}.vrow:last-child{border-bottom:0}
  .vrow .vt{font-size:11px;font-weight:700}
  .vk-source{color:var(--sell)} .vk-optimize{color:var(--run)} .vk-manual{color:var(--muted)}
  .vrow .vi{font-size:11px;color:var(--muted)} .vrow .vx{font-size:12px;color:var(--ink);line-height:1.5;margin-top:3px;max-height:80px;overflow:auto}

  .genbar{position:sticky;bottom:-60px;margin-top:20px}
  button.primary{width:100%;background:linear-gradient(90deg,#2f6bed,#5a52d8);color:#fff;border:0;
    padding:15px;font-size:15px;display:flex;align-items:center;justify-content:center;gap:9px;border-radius:12px}
  button.primary:hover{filter:brightness(1.05)}
  button.primary .price{background:rgba(255,255,255,.22);border-radius:999px;padding:2px 11px;font-size:12.5px}

  .avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#2f6bed,#5a52d8);color:#fff;
    border:0;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .usermenu{position:relative}
  .usermenu-pop{position:absolute;right:0;top:42px;background:#fff;border:1px solid var(--line);border-radius:12px;
    box-shadow:var(--sh);padding:8px;min-width:170px;display:none;z-index:60}
  .usermenu:hover .usermenu-pop{display:block}
  .usermenu-pop::before{content:"";position:absolute;right:0;top:-12px;width:60px;height:12px}
  .um-item{display:block;width:100%;text-align:left;background:transparent;border:0;box-shadow:none;padding:9px 12px;border-radius:8px}
  .um-item:hover{background:var(--accent-weak)}
  .um-head{padding:6px 12px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}

  .iconbtn{display:inline-flex;align-items:center;border:1px solid var(--line-2);background:#fff;
    border-radius:999px;padding:7px 8px;cursor:pointer;overflow:hidden;transition:.18s;color:var(--sub);box-shadow:var(--sh-sm)}
  .iconbtn svg{flex:0 0 18px}
  .iconbtn .lbl{max-width:0;opacity:0;white-space:nowrap;transition:.18s;font-size:12px;font-weight:600}
  .iconbtn:hover{border-color:var(--accent);color:var(--accent)}
  .iconbtn:hover .lbl,.iconbtn.on .lbl{max-width:48px;opacity:1;margin-left:6px}
  .iconbtn.on{background:var(--accent-weak);border-color:var(--accent);color:var(--accent-ink)}
  /* 个人/全体 滑动切换（同分析页 中/EN 样式）*/
  .bi-tabs{display:inline-flex;gap:1px;background:var(--line-2);border-radius:7px;padding:2px;vertical-align:middle}
  .bi-tabs button{border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:600;padding:4px 12px;border-radius:6px;cursor:pointer;box-shadow:none;line-height:1.5}
  .bi-tabs button:hover{background:transparent;color:var(--sub)}
  .bi-tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.12)}

  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
  .g-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--sh-sm);cursor:pointer;transition:.15s}
  .g-card:hover{box-shadow:var(--sh);transform:translateY(-1px)}
  .g-media{width:100%;aspect-ratio:16/10;background:#0c1222;display:flex;align-items:center;justify-content:center;color:#6b7796;font-size:12px;text-align:center;padding:6px}
  .g-media video,.g-media img{width:100%;height:100%;object-fit:cover}
  .g-body{padding:11px 13px}.g-body .p{font-size:12px;color:var(--sub);max-height:52px;overflow:hidden;line-height:1.5}
  .g-meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11px;color:var(--muted);gap:6px}
  .g-owner{display:inline-flex;align-items:center;gap:4px}
  .g-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
  .tag{font-size:10.5px;padding:1px 7px;border-radius:999px;background:var(--panel-2);color:var(--sub);border:1px solid var(--line)}
  .badge{font-size:11px;padding:2px 9px;border-radius:999px;font-weight:600}
  .b-run{background:var(--run-bg);color:var(--run)} .b-ok{background:var(--ok-bg);color:var(--ok)} .b-err{background:var(--warn-bg);color:var(--warn)}
  .notice{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:12px;margin-bottom:14px;display:none}

  .drawer{position:fixed;top:0;right:0;bottom:0;z-index:46;background:var(--panel);
    border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(16,24,40,.08);transform:translateX(100%);
    transition:transform .24s ease;display:flex;flex-direction:column;max-width:94vw}
  #pick{width:var(--pick-w)} #detail{width:var(--dt-w)}
  body.pick-open #pick{transform:translateX(0)} body.detail-open #detail{transform:translateX(0)}
  .dr-grip{position:absolute;left:0;top:0;width:7px;height:100%;cursor:ew-resize;z-index:3}
  .dr-grip:hover{background:var(--accent-weak)}
  .dr-hd{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .dr-hd b{font-size:14px}.dr-bd{flex:1;overflow-y:auto;padding:14px 16px}
  /* 使用分析结果：任务级树形 + 缩进 */
  .tk{border:1px solid var(--line);border-radius:11px;margin-bottom:12px;overflow:hidden}
  .tk>summary{list-style:none;cursor:pointer;padding:10px 12px;background:var(--panel-2);font-weight:700;font-size:12.5px;display:flex;align-items:center;gap:8px}
  .tk>summary::-webkit-details-marker{display:none}
  .tk>summary .tw{margin-left:auto;font-size:11px;color:var(--muted);font-weight:600}
  .tk .adg{border-left:2px solid var(--line-2);margin:8px 0 8px 14px;padding-left:10px}
  .tk .adg>.ah{font-size:12px;color:var(--sell);font-weight:700;margin:6px 0}
  .dr-x{margin-left:auto;cursor:pointer;font-weight:700;color:var(--muted)}
  .sec{margin-bottom:16px}.sec>.h{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px}
  .box{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel-2);font-size:13px;line-height:1.6}
  .dvid{width:100%;border-radius:10px;background:#0c1222;aspect-ratio:16/9}
  .pgroup{margin-bottom:14px}.pgroup>.h{font-size:12px;color:var(--muted);font-weight:700;margin:6px 0}
  .pitem{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:9px;background:var(--panel-2)}
  .pitem .lv{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;margin-right:6px}
  .lv-video{background:var(--accent-weak);color:var(--accent-ink)} .lv-shot{background:var(--run-bg);color:var(--run)} .lv-common{background:var(--sell-bg);color:var(--sell)}
  .pitem .t{font-size:12.5px;color:var(--ink);line-height:1.55;margin:7px 0;max-height:96px;overflow:auto}
  .pitem .sell{font-size:11px;color:var(--sell)}.pitem .act{display:flex;gap:8px;justify-content:flex-end}
  .verstep{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
  .verstep.cur{border-color:var(--accent);background:var(--accent-weak)}
  .verstep .vh{display:flex;align-items:center;gap:8px;font-size:12px}.verstep .vh b{font-size:13px}
</style>
</head>
<body>
<nav id="rail">
  <button class="rail-toggle" onclick="toggleRail()" title="展开/收起">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>
  <a class="rail-item" data-path="/" href="/" title="广告分析">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.3L19 10l-5.1 1.7L12 17l-1.9-5.3L5 10l5.1-1.7z"/></svg>
    <span>广告分析</span>
  </a>
  <a class="rail-item" data-path="/studio" href="/studio" title="素材生成">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m10 9 5 3-5 3z"/></svg>
    <span>素材生成</span>
  </a>
  <div class="rail-subs" id="railSubs">
    <a class="rail-sub" data-mode="video" href="/studio#video" title="视频生成">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="14" height="14" rx="2"/><path d="M16 10l6-3v10l-6-3"/></svg>
      <span>视频生成</span>
    </a>
    <a class="rail-sub" data-mode="image" href="/studio#image" title="图片生成">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.8"/><path d="m5 17 4-4 3 3 3-3 4 4"/></svg>
      <span>图片生成</span>
    </a>
  </div>
  <div class="rail-sp"></div>
  <div class="rail-brand">云熙汇智</div>
</nav>

<header>
  <h1>素材生成</h1>
  <span class="modechip" id="modeChip">视频生成</span>
  <span style="margin-left:auto;display:flex;gap:12px;align-items:center">
    <span class="chip" id="provChip">检测中…</span>
    <div id="userMenu" class="usermenu">
      <button class="avatar" id="avatarBtn" title="账号">U</button>
      <div class="usermenu-pop">
        <div class="um-head"><b id="um-name"></b> <span id="um-role" class="muted"></span></div>
        <button class="um-item" onclick="location.href='/account'">个人中心</button>
        <button class="um-item" onclick="location.href='/account'">账号设置</button>
        <button class="um-item" id="um-admin" style="display:none" onclick="location.href='/admin'">后台管理</button>
      </div>
    </div>
  </span>
</header>

<div id="scroll">
<div class="studio">

  <!-- 左：生成面板（可下滑）-->
  <aside class="gen-panel">
    <div class="notice" id="notice"></div>

    <div class="lab">模型</div>
    <div class="mdd" id="familyDD">
      <div class="mdd-head" onclick="toggleFamilyDD(event)">
        <div class="mi" id="famIcon"></div>
        <div class="mdd-name" id="famName">—</div>
        <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </div>
      <div class="mdd-pop" id="famPop"></div>
    </div>

    <div id="verWrap"><div class="lab">模型版本</div><div class="vercards" id="vercards"></div></div>

    <div class="lab"><span>提示词</span>
      <span class="ptools">
        <button class="soft" onclick="openPick()">使用分析结果</button>
        <button class="soft" id="btnOpt" onclick="doOptimize()" title="AI 按广告素材标准优化提示词">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M12 3l1.4 3.9L17 8l-3.6 1.1L12 13l-1.4-3.9L7 8l3.6-1.1z"/><path d="M19 14l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></svg> AI优化提示词
        </button>
      </span>
    </div>
    <div class="srcbar" id="srcbar"><span id="srcTxt"></span><span class="x" onclick="clearSrc()">✕</span></div>
    <div class="taWrap">
      <textarea id="prompt" placeholder="描述你想生成的画面；也可点「使用分析结果」把分析出的镜头脚本一键填入，再点「AI优化提示词」按广告标准优化…" maxlength="2000" oninput="updCC()"></textarea>
      <span class="cc" id="cc">0/2000</span>
    </div>
    <div class="verbar" id="verbar"><span id="verTxt"></span><span class="lnk" onclick="toggleVList()">查看版本</span></div>
    <div class="vlist" id="vlist"></div>

    <div class="lab" id="refLab">参考图 / 首帧 <span class="muted" style="font-weight:400">（可选，最多 4 张，第 1 张为首帧）</span></div>
    <div class="refzone" id="refzone">
      <div class="refgrid" id="refgrid"></div>
      <div class="refadd" id="refadd" onclick="pickRefFile()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="M8 8l4-4 4 4"/><path d="M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg>
        <span>点击上传 · 拖入本地/网页图片 · 或粘贴 URL</span>
      </div>
      <input id="refurl" placeholder="粘贴图片 URL，回车添加" style="width:100%;margin-top:8px"
             onkeydown="if(event.key==='Enter'){event.preventDefault();addRefUrl();}">
      <input type="file" id="reffile" accept="image/*" multiple style="display:none" onchange="onRefFiles(event)">
    </div>

    <div id="durWrap"><div class="lab">时长（秒）</div><div class="bgroup" id="durGroup"></div></div>
    <div class="lab">分辨率</div><div class="bgroup" id="resGroup"></div>
    <div id="aspWrap"><div class="lab">画幅</div><div class="bgroup" id="aspGroup"></div></div>
    <div id="numWrap" style="display:none"><div class="lab">数量</div><div class="bgroup" id="numGroup"></div></div>

    <div class="lab">归属分组</div>
    <input id="project" placeholder="生成" value="生成" style="width:100%">

    <div class="srcbar" id="parentbar" style="background:var(--run-bg);color:var(--run)">
      <span id="parentTxt"></span><span class="x" onclick="clearParent()">✕</span>
    </div>

    <div class="genbar">
      <button class="primary" id="btnGen" onclick="doGenerate()">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.3L19 10l-5.1 1.7L12 17l-1.9-5.3L5 10l5.1-1.7z"/></svg>
        <span>开始生成</span><span class="price" id="btnPrice">—</span>
      </button>
      <div class="muted" id="genHint" style="font-size:12px;text-align:center;margin-top:8px"></div>
    </div>
  </aside>

  <!-- 右：结果任务 -->
  <section class="results">
    <div class="res-hd">
      <span class="ttl">生成结果</span>
      <span style="margin-left:auto;display:flex;gap:8px;align-items:center">
        <button class="iconbtn on" id="viewMine" onclick="setView(1)" title="个人">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
          <span class="lbl">个人</span>
        </button>
        <button class="iconbtn" id="viewTeam" onclick="setView(0)" title="团队">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.4"/><path d="M2.5 20c0-3.6 3-5.6 6.5-5.6"/><circle cx="17" cy="9" r="2.8"/><path d="M14.5 14.6c3.2 .1 6 1.9 6 5.4"/></svg>
          <span class="lbl">团队</span>
        </button>
        <button class="iconbtn" onclick="loadGallery()" title="刷新">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.3"/><path d="M21 3v5h-5"/></svg>
          <span class="lbl">刷新</span>
        </button>
      </span>
    </div>
    <div class="gallery" id="gallery"><div class="muted">加载中…</div></div>
  </section>
</div>
</div>

<!-- 使用分析结果抽屉 -->
<div id="pick" class="drawer">
  <div class="dr-grip" onmousedown="startDrawerResize(event,'pick')"></div>
  <div class="dr-hd">
    <b>使用分析结果</b>
    <div class="bi-tabs" id="pickScope"><button class="on" onclick="setPickScope(1)">个人</button><button onclick="setPickScope(0)">全体</button></div>
    <span class="dr-x" onclick="closePick()">✕</span>
    <select id="pickProject" style="flex:1 1 100%;margin-top:6px" onchange="loadPickItems()"><option value="">选择一个已分析的分组…</option></select>
  </div>
  <div class="dr-bd" id="pickBody"><div class="muted">先选择一个分组。</div></div>
</div>

<!-- 结果详情抽屉 -->
<div id="detail" class="drawer">
  <div class="dr-grip" onmousedown="startDrawerResize(event,'detail')"></div>
  <div class="dr-hd"><b id="dtTitle">任务详情</b><span class="dr-x" onclick="closeDetail()">✕</span></div>
  <div class="dr-bd" id="detailBody"></div>
</div>

<script>
const $=s=>document.querySelector(s);
let _token=null,_user='',_role='';
let MODELS=[],_curType='video',_mode='video',_mine=1,_pollTimer=null,_pickProjects=[];
let _families=[],_modelId='',_params={};
let _pv=[],_parentId=null;

function _loadToken(){try{return localStorage.getItem('authToken')||sessionStorage.getItem('authToken')||null}catch(e){return null}}
const headers=()=>_token?{'Authorization':'Bearer '+_token}:{};
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
const MODE_NAME={video:'视频生成',image:'图片生成'};

// ── 左栏 ──
function toggleRail(){const on=!document.body.classList.contains('rail-open');
  document.body.classList.toggle('rail-open',on);try{localStorage.setItem('railOpen',on?'1':'0')}catch(e){}setTimeout(measureHdr,220);}
function initRail(){let o='0';try{o=localStorage.getItem('railOpen')||'0'}catch(e){}
  document.body.classList.toggle('rail-open',o==='1');
  const p=location.pathname.replace(/\/+$/,'')||'/';
  document.querySelectorAll('#rail .rail-item').forEach(a=>a.classList.toggle('active',a.getAttribute('data-path')===p));
  document.querySelectorAll('#rail .rail-sub').forEach(a=>{
    a.classList.toggle('active',p==='/studio'&&a.getAttribute('data-mode')===_mode);
    a.addEventListener('click',e=>{if(p==='/studio'){e.preventDefault();setMode(a.getAttribute('data-mode'));}});
  });}
function measureHdr(){const h=$('header');if(h)document.documentElement.style.setProperty('--hdr-h',h.offsetHeight+'px');}

// ── 鉴权 ──
async function boot(){
  _token=_loadToken();if(!_token){location.href='/';return;}
  try{const r=await fetch('/auth/me',{headers:headers()});if(!r.ok)throw 0;
    const d=await r.json();_user=d.username;_role=d.role;
    $('#avatarBtn').textContent=(_user[0]||'U').toUpperCase();
    $('#um-name').textContent=_user;$('#um-role').textContent=_role==='admin'?'管理员':'成员';
    if(_role==='admin')$('#um-admin').style.display='block';
  }catch(e){location.href='/';return;}
  _mode=(location.hash||'').replace('#','')||'video';if(!MODE_NAME[_mode])_mode='video';
  await loadModels();prefill();loadGallery();
  window.addEventListener('hashchange',()=>{const m=(location.hash||'').replace('#','');if(MODE_NAME[m])setMode(m);});
}

// ── 生成类型（左栏子模块：视频/图片）──
function setMode(mode){
  _mode=mode;_curType=mode;
  if(location.hash!=='#'+mode)history.replaceState(null,'','/studio#'+mode);
  $('#modeChip').textContent=MODE_NAME[mode];
  document.querySelectorAll('#rail .rail-sub').forEach(a=>a.classList.toggle('active',a.getAttribute('data-mode')===mode));
  $('#refLab').innerHTML='参考图 / 首帧 <span class="muted" style="font-weight:400">（可选，最多 4 张，第 1 张为首帧；填了即图生'+(mode==='image'?'图':'视频')+'）</span>';
  buildFamilies();
}

// ── 模型：family + version ──
async function loadModels(){
  const r=await fetch('/gen/models',{headers:headers()});const d=await r.json();
  MODELS=d.models||[];const p=d.providers||{};
  const chip=$('#provChip');
  if(p.seedance){chip.className='chip ok';chip.textContent='Seedance ✓ 已就绪';}
  else{chip.className='chip warn';chip.textContent='Seedance 未配置';
    const n=$('#notice');n.style.display='block';n.textContent='⚠ 尚未配置 SEEDANCE_KEY，配置后即可生成。';}
  setMode(_mode);
}
// 品牌图标：同名（同系列）不同版本共用同一图标
const SVG_WAVE='<svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="9" width="2.2" height="6" rx="1.1"/><rect x="7.2" y="6" width="2.2" height="12" rx="1.1"/><rect x="11.4" y="3.5" width="2.2" height="17" rx="1.1"/><rect x="15.6" y="7" width="2.2" height="10" rx="1.1"/><rect x="19.8" y="10" width="2.2" height="4" rx="1.1" opacity=".7"/></svg>';
const SVG_STAR='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.3L19 10l-5.1 1.7L12 17l-1.9-5.3L5 10l5.1-1.7z"/></svg>';
const SVG_IMG='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="m5 17 4-4 3 3 3-3 4 4"/></svg>';
function brandIcon(name){const n=(name||'').toLowerCase();
  if(n.includes('flux')||n.includes('图'))return SVG_IMG;
  if(n.includes('wan')||n.includes('kling')||n.includes('veo'))return SVG_STAR;
  return SVG_WAVE;}   // seedance 及默认 → 波形
let _famIdx=0;
function buildFamilies(){
  const list=MODELS.filter(m=>m.kind===_curType);
  const map={};list.forEach(m=>{(map[m.family]=map[m.family]||{family:m.family,versions:[]}).versions.push(m);});
  _families=Object.values(map);
  const pop=$('#famPop');pop.innerHTML='';
  if(!_families.length){$('#famName').textContent='（暂无可用模型）';$('#famIcon').innerHTML='';$('#vercards').innerHTML='';return;}
  _families.forEach((f,i)=>{
    const o=document.createElement('div');o.className='mdd-opt';
    o.innerHTML='<div class="mi2">'+brandIcon(f.family)+'</div><span class="nm">'+esc(f.family)+'</span>'+
      '<svg class="ck" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
    o.onclick=()=>{selectFamily(i);closeFamilyDD();};
    pop.appendChild(o);
  });
  selectFamily(0);
}
function selectFamily(i){
  _famIdx=i;const f=_families[i];if(!f)return;
  $('#famName').textContent=f.family;$('#famIcon').innerHTML=brandIcon(f.family);
  $('#famPop').querySelectorAll('.mdd-opt').forEach((el,k)=>el.classList.toggle('on',k===i));
  const icon=brandIcon(f.family);
  const wrap=$('#verWrap'),vc=$('#vercards');vc.innerHTML='';
  wrap.style.display=f.versions.length>1?'':'none';   // 单版本则隐藏版本卡
  f.versions.forEach((m,k)=>{
    const c=document.createElement('div');c.className='vercard'+(k===0?' on':'');
    c.innerHTML='<span class="rd"></span><div class="vi">'+icon+'</div><b>'+esc(m.version||m.label)+'</b>';
    c.onclick=()=>{vc.querySelectorAll('.vercard').forEach(x=>x.classList.remove('on'));c.classList.add('on');selectModel(m.id);};
    vc.appendChild(c);
  });
  selectModel(f.versions[0].id);
}
function toggleFamilyDD(e){if(e)e.stopPropagation();$('#familyDD').classList.toggle('open');}
function closeFamilyDD(){$('#familyDD').classList.remove('open');}
document.addEventListener('click',e=>{if(!e.target.closest('#familyDD'))closeFamilyDD();});
function curModel(){return MODELS.find(m=>m.id===_modelId)}
function selectModel(id){_modelId=id;buildParams();}
function bg(container,arr,cur,onPick,fmt){
  const el=$(container);el.innerHTML='';
  arr.forEach(v=>{const b=document.createElement('button');b.className='bopt'+((''+v)===(''+cur)?' on':'');
    b.textContent=fmt?fmt(v):v;b.onclick=()=>{el.querySelectorAll('.bopt').forEach(x=>x.classList.remove('on'));b.classList.add('on');onPick(v);updEst();};
    el.appendChild(b);});
}
function buildParams(){
  const m=curModel();if(!m)return;
  _params={};
  if(m.kind==='video'){
    $('#durWrap').style.display=m.durations.length?'':'none';
    $('#aspWrap').style.display=(m.aspects.length)?'':'none';
    $('#numWrap').style.display='none';
    if(m.durations.length){_params.duration=m.durations[0];bg('#durGroup',m.durations,_params.duration,v=>_params.duration=+v,v=>v+'s');}
    if(m.resolutions.length){_params.resolution=m.resolutions.includes('720p')?'720p':m.resolutions[0];bg('#resGroup',m.resolutions,_params.resolution,v=>_params.resolution=v,v=>(''+v).toUpperCase());}
    if(m.aspects.length){_params.aspect=m.aspects[0];bg('#aspGroup',m.aspects,_params.aspect,v=>_params.aspect=v);}
  }else{
    $('#durWrap').style.display='none';$('#aspWrap').style.display=m.aspects.length?'':'none';$('#numWrap').style.display='';
    if(m.resolutions.length){_params.resolution=m.resolutions[0];bg('#resGroup',m.resolutions,_params.resolution,v=>_params.resolution=v);}
    _params.num=1;bg('#numGroup',[1,2,3,4],1,v=>_params.num=+v);
  }
  updEst();
}
function gatherParams(){return Object.assign({},_params);}
function estUsd(m,p){
  if(!m)return 0;
  if(m.kind==='video'){
    const dur=p.duration||(m.durations[0]||5);
    if(m.price_kind==='table'&&m.table){if(m.table[dur]!=null)return +m.table[dur];
      const keys=Object.keys(m.table).map(Number);const k=keys.reduce((a,b)=>Math.abs(b-dur)<Math.abs(a-dur)?b:a,keys[0]);return m.table[k]/k*dur;}
    if(m.price_kind==='mini'&&m.mini_rate){const rate=m.mini_rate[p.resolution]||m.mini_rate['720p']||0;return Math.ceil(rate*dur*100)/100;}
    return 0;}
  return (m.usd_per_image||0)*(p.num||1);
}
function updEst(){const m=curModel();if(!m){$('#btnPrice').textContent='—';return;}$('#btnPrice').textContent='$'+estUsd(m,_params).toFixed(2);}
function updCC(){$('#cc').textContent=($('#prompt').value.length)+'/2000';}

// ── 提示词版本 ──
function setPromptVersion(text,kind,instruction){
  _pv.push({v:_pv.length+1,kind:kind||'manual',instruction:instruction||'',text:text||'',at:new Date().toISOString()});
  $('#prompt').value=text||'';updCC();renderVerbar();
}
function renderVerbar(){const vb=$('#verbar');
  if(!_pv.length){vb.classList.remove('on');$('#vlist').classList.remove('on');return;}
  vb.classList.add('on');const opt=_pv.filter(x=>x.kind==='optimize').length;
  $('#verTxt').textContent='提示词版本 '+_pv.length+' 版'+(opt?('（AI优化 '+opt+' 次）'):'');}
function toggleVList(){const vl=$('#vlist');vl.classList.toggle('on');if(!vl.classList.contains('on'))return;
  vl.innerHTML=_pv.map(x=>{const kn={source:'来源(分析)',manual:'手写',optimize:'AI优化提示词'}[x.kind]||x.kind;
    return '<div class="vrow"><span class="vt vk-'+x.kind+'">v'+x.v+' · '+kn+'</span>'+(x.instruction?('<div class="vi">优化要求：'+esc(x.instruction)+'</div>'):'')+'<div class="vx">'+esc(x.text)+'</div></div>';}).join('');}
async function doOptimize(){
  let cur=$('#prompt').value.trim();if(!cur){alert('请先填写或选择提示词');return;}
  if(!_pv.length||_pv[_pv.length-1].text!==cur)_pv.push({v:_pv.length+1,kind:'manual',instruction:'',text:cur,at:new Date().toISOString()});
  const instruction=prompt('可选：填写本次优化要求（留空则按广告素材标准整体优化）','')||'';
  const btn=$('#btnOpt');btn.disabled=true;btn.textContent='优化中…';
  try{const r=await fetch('/gen/optimize',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({text:cur,instruction,kind:_curType})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||!d.optimized){alert((d&&d.detail)||'优化失败');}
    else{_pv.push({v:_pv.length+1,kind:'optimize',instruction,text:d.optimized,at:new Date().toISOString()});$('#prompt').value=d.optimized;updCC();renderVerbar();const vl=$('#vlist');if(vl.classList.contains('on')){toggleVList();toggleVList();}}
  }catch(e){alert('优化失败：'+e);}
  btn.disabled=false;btn.innerHTML='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M12 3l1.4 3.9L17 8l-3.6 1.1L12 13l-1.4-3.9L7 8l3.6-1.1z"/></svg> AI优化提示词';
}

// ── 生成 ──
async function doGenerate(){
  const m=curModel();if(!m){alert('请选择模型');return;}
  if(!m.configured){alert('该模型未配置 API key，暂不能生成');return;}
  const promptText=$('#prompt').value.trim();const refs=_refs.map(r=>r.url).filter(Boolean);
  if(_refs.some(r=>r.uploading)){alert('有参考图还在上传，请稍候');return;}
  if(!promptText&&!refs.length){alert('请填写提示词或参考图');return;}
  if(promptText&&(!_pv.length||_pv[_pv.length-1].text!==promptText))_pv.push({v:_pv.length+1,kind:'manual',instruction:'',text:promptText,at:new Date().toISOString()});
  $('#btnGen').disabled=true;$('#genHint').textContent='提交中…';
  try{const body={type:_curType,model:m.id,prompt:promptText,project_id:$('#project').value.trim()||'生成',
      params:gatherParams(),ref_image_urls:refs,prompt_versions:_pv,parent_id:_parentId};
    const r=await fetch('/gen/create',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){$('#genHint').textContent='';alert((d&&d.detail)||'提交失败');$('#btnGen').disabled=false;return;}
    $('#genHint').textContent='已提交，生成中（约 1–2 分钟）…';if(!_mine)setView(1);else loadGallery();startPolling();
  }catch(e){alert('提交失败：'+e);}
  $('#btnGen').disabled=false;setTimeout(()=>$('#genHint').textContent='',4000);
}
function startPolling(){if(_pollTimer)return;let n=0;_pollTimer=setInterval(async()=>{n++;await loadGallery();if(n>60){clearInterval(_pollTimer);_pollTimer=null;}},5000);}

// ── 结果 ──
function setView(mine){_mine=mine;$('#viewMine').classList.toggle('on',mine===1);$('#viewTeam').classList.toggle('on',mine===0);loadGallery();}
async function loadGallery(){
  let jobs=[];try{const r=await fetch('/gen/list?mine='+_mine,{headers:headers()});const d=await r.json();jobs=d.jobs||[];}catch(e){}
  const g=$('#gallery');
  if(!jobs.length){g.innerHTML='<div class="muted">'+(_mine?'你还没有生成记录。':'团队还没有生成记录。')+'</div>';return;}
  if(!jobs.some(j=>j.status==='running')&&_pollTimer){clearInterval(_pollTimer);_pollTimer=null;}
  g.innerHTML='';jobs.forEach(j=>g.appendChild(galleryCard(j)));
}
const ICON_ONE='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>';
function typeName(kind){return kind==='gen_image'?'图片':'视频';}
function galleryCard(j){
  const c=document.createElement('div');c.className='g-card';c.onclick=()=>openDetail(j.id);
  const bcls=j.status==='running'?'b-run':(j.ok?'b-ok':'b-err');const btxt=j.status==='running'?'生成中':(j.ok?'完成':'失败');
  const owner=j.owner?('<span class="g-owner">'+ICON_ONE+esc(j.owner)+'</span>'):'';
  const vtag=(j.ver&&j.ver>1)?('<span class="tag">v'+j.ver+'</span>'):'';
  c.innerHTML='<div class="g-media" id="m'+j.id+'">'+(j.status==='running'?'⏳ 生成中…':(j.ok?'':'✗ '+esc(j.detail||'失败')))+'</div>'+
    '<div class="g-body"><div class="p">'+esc(j.ref||'')+'</div>'+
    '<div class="g-tags"><span class="tag">'+typeName(j.kind)+'</span><span class="tag">'+esc(j.product||'')+'</span>'+vtag+'</div>'+
    '<div class="g-meta"><span>编号 '+esc(j.series_id||'')+'</span>'+owner+'<span class="badge '+bcls+'">'+btxt+'</span></div></div>';
  if(j.status==='done'&&j.ok)loadThumb(j.id);
  return c;
}
async function loadThumb(id){try{const d=await (await fetch('/gen/result?job_id='+id,{headers:headers()})).json();
  const box=$('#m'+id);if(!box||!d.meta||!(d.meta.items||[]).length)return;const it=d.meta.items[0];
  box.innerHTML=(it.kind==='video')?('<video src="'+it.url+'" preload="metadata"></video>'):('<img src="'+it.url+'" loading="lazy">');}catch(e){}}

// ── 详情 + 改词重生成 ──
async function openDetail(id){
  document.body.classList.add('detail-open');const bd=$('#detailBody');bd.innerHTML='<div class="muted">加载中…</div>';
  try{const d=await (await fetch('/gen/result?job_id='+id,{headers:headers()})).json();const meta=d.meta||{};
    $('#dtTitle').textContent='编号 '+(d.series_id||'')+' · v'+(d.ver||1);
    const it=(meta.items||[])[0];
    const media=it?((it.kind==='video')?('<video class="dvid" src="'+it.url+'" controls></video>'):('<img src="'+it.url+'" style="width:100%;border-radius:10px">')):'<div class="box muted">'+(d.status==='running'?'生成中…':'（暂无素材）')+'</div>';
    const pv=meta.prompt_versions||[];
    const pvHtml=pv.length?pv.map(x=>{const kn={source:'来源(分析)',manual:'手写',optimize:'AI优化提示词'}[x.kind]||x.kind;
      return '<div class="vrow"><span class="vt vk-'+x.kind+'">v'+x.v+' · '+kn+'</span>'+(x.instruction?('<div class="vi">优化要求：'+esc(x.instruction)+'</div>'):'')+'<div class="vx">'+esc(x.text)+'</div></div>';}).join(''):'<div class="muted" style="font-size:12px">无优化记录</div>';
    bd.innerHTML=
      '<div class="sec"><div class="h">生成类型</div><div class="box">'+MODE_NAME[meta.type==='image'?'image':'video']+' · '+esc(meta.model||d.model||'')+'</div></div>'+
      '<div class="sec"><div class="h">生成素材</div>'+media+'</div>'+
      '<div class="sec"><div class="h">最终提示词</div><div class="box">'+esc(meta.prompt||d.detail||'')+'</div></div>'+
      '<div class="sec"><div class="h">提示词版本（优化历史）</div><div class="box" style="padding:6px 10px">'+pvHtml+'</div></div>'+
      '<div class="sec"><div class="h">版本谱系（改词重生成历史）</div><div id="seriesBox" class="muted" style="font-size:12px">加载中…</div></div>'+
      '<button class="primary" style="margin-top:6px" onclick="regen('+id+')"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.3"/><path d="M21 3v5h-5"/></svg><span>改提示词并重新生成</span></button>';
    loadSeries(d.series_id,id);
  }catch(e){bd.innerHTML='<div class="muted">加载失败。</div>';}
}
async function loadSeries(sid,curId){if(!sid)return;
  try{const d=await (await fetch('/gen/series?series_id='+encodeURIComponent(sid),{headers:headers()})).json();const box=$('#seriesBox');const vs=d.versions||[];
    if(vs.length<=1){box.innerHTML='<span class="muted" style="font-size:12px">仅一个版本。改词重生成会在这里形成历史。</span>';return;}
    box.className='';box.innerHTML=vs.map(v=>{const m=v.meta||{};const it=(m.items||[])[0];const thumb=it?(it.kind==='video'?'🎬':'🖼'):'…';
      return '<div class="verstep'+(v.id===curId?' cur':'')+'"><div class="vh">'+thumb+' <b>v'+(v.ver||1)+'</b><span class="muted" style="font-size:11px">'+esc(m.model||'')+'</span>'+
        (v.id!==curId?'<span style="margin-left:auto;color:var(--accent);cursor:pointer" onclick="openDetail('+v.id+')">查看</span>':'<span style="margin-left:auto;font-size:11px" class="muted">当前</span>')+
        '</div><div class="vx" style="font-size:12px;color:var(--sub);margin-top:5px;max-height:44px;overflow:hidden">'+esc(m.prompt||'')+'</div></div>';}).join('');
  }catch(e){}
}
async function regen(id){
  try{const d=await (await fetch('/gen/result?job_id='+id,{headers:headers()})).json();const meta=d.meta||{};
    _pv=[];_parentId=id;setMode(meta.type==='image'?'image':'video');
    $('#prompt').value=meta.prompt||'';updCC();_pv.push({v:1,kind:'manual',instruction:'',text:meta.prompt||'',at:new Date().toISOString()});renderVerbar();
    _refs=((meta.ref_image_urls&&meta.ref_image_urls.length)?meta.ref_image_urls:(meta.ref_image_url?[meta.ref_image_url]:[])).map(u=>({url:u}));renderRefs();
    if(meta.project_id)$('#project').value=meta.project_id;
    $('#parentTxt').textContent='改词重生成自：编号 '+(d.series_id||'')+' · v'+(d.ver||1);$('#parentbar').classList.add('on');
    closeDetail();$('#prompt').focus();
  }catch(e){alert('载入失败：'+e);}
}
function closeDetail(){document.body.classList.remove('detail-open');}
function clearParent(){_parentId=null;$('#parentbar').classList.remove('on');}

// ── 使用分析结果 ──
function openPick(){document.body.classList.add('pick-open');if(!_pickProjects.length)loadPickProjects();}
function closePick(){document.body.classList.remove('pick-open');}
let _pickMine=1;
function setPickScope(mine){_pickMine=mine;
  $('#pickScope').querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',(i===0)===(mine===1)));
  loadPickProjects();}
async function loadPickProjects(){
  try{const r=await fetch('/gen/prompt_projects?mine='+_pickMine,{headers:headers()});const d=await r.json();_pickProjects=d.projects||[];
    const sel=$('#pickProject');sel.innerHTML='<option value="">选择一个已分析的分组…</option>';
    _pickProjects.forEach((p,i)=>{const o=document.createElement('option');o.value=i;o.textContent=p.project_id+(p.owner?'（@'+p.owner+'）':'');sel.appendChild(o);});
    $('#pickBody').innerHTML='<div class="muted">'+(_pickProjects.length?'请选择一个分组。':'暂无已分析的分组。到「广告分析」跑完分析后再来。')+'</div>';
  }catch(e){$('#pickBody').innerHTML='<div class="muted">加载失败。</div>';}
}
async function loadPickItems(){const i=$('#pickProject').value;if(i==='')return;const p=_pickProjects[+i];$('#pickBody').innerHTML='<div class="muted">加载中…</div>';
  try{const r=await fetch('/gen/prompt_pick?project_id='+encodeURIComponent(p.project_id)+'&owner='+encodeURIComponent(p.owner||''),{headers:headers()});
    const d=await r.json();renderPickItems(d.items||[]);}catch(e){$('#pickBody').innerHTML='<div class="muted">加载失败。</div>';}
}
// 任务级树形：批次(任务) › 广告 › 提示词，逐级缩进代表归属
function renderPickItems(items){const bd=$('#pickBody');
  if(!items.length){bd.innerHTML='<div class="muted">该分组没有可用的提示词产物。</div>';return;}
  const byBatch={};items.forEach(it=>{(byBatch[it.batch||'-']=byBatch[it.batch||'-']||[]).push(it);});
  bd.innerHTML='';
  Object.keys(byBatch).forEach((b,bi)=>{
    const arr=byBatch[b];
    const tk=document.createElement('details');tk.className='tk';tk.open=bi===0;
    const sm=document.createElement('summary');
    sm.innerHTML='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>任务 '+esc(b)+'<span class="tw">'+arr.length+' 条提示词</span>';
    tk.appendChild(sm);
    // 按广告分组
    const byAd={};arr.forEach(it=>{const k=(it.level==='common')?'__共性__':(it.ad||'-');(byAd[k]=byAd[k]||[]).push(it);});
    Object.keys(byAd).forEach(ad=>{
      const adg=document.createElement('div');adg.className='adg';
      adg.innerHTML='<div class="ah">'+(ad==='__共性__'?'品类共性镜头':('广告：'+esc(ad)))+'</div>';
      byAd[ad].forEach(it=>adg.appendChild(pickItemNode(it)));
      tk.appendChild(adg);
    });
    bd.appendChild(tk);
  });
}
function pickItemNode(it){const lv={video:['视频级','lv-video'],shot:['镜头 '+(it.idx||''),'lv-shot'],common:['共性','lv-common']}[it.level]||['',''];
  const el=document.createElement('div');el.className='pitem';const adline=it.ad?('<span class="muted" style="font-size:11px">'+esc(it.ad)+'</span>'):'';
  const sell=(it.卖点&&it.卖点.length)?('<div class="sell">卖点：'+it.卖点.map(esc).join('、')+'</div>'):'';
  el.innerHTML='<div><span class="lv '+lv[1]+'">'+esc(lv[0])+'</span>'+adline+'</div><div class="t">'+esc(it.text)+'</div>'+sell+'<div class="act"><button class="soft" onclick="fillFromPick(this)">填入提示词</button></div>';
  el.querySelector('button')._it=it;return el;
}
function fillFromPick(btn){const it=btn._it;_pv=[];clearParent();
  const lvname={video:'视频级脚本',shot:'镜头 '+(it.idx||''),common:'共性镜头'}[it.level]||'';const src='分析：'+(it.batch||'')+(it.ad?(' · '+it.ad):'')+' · '+lvname;
  setPromptVersion(it.text,'source',src);$('#srcTxt').textContent='来源：'+src;$('#srcbar').classList.add('on');closePick();$('#prompt').focus();
}
function clearSrc(){$('#srcbar').classList.remove('on');$('#prompt').value='';updCC();_pv=[];renderVerbar();}

function prefill(){try{const q=new URLSearchParams(location.search);let pf=null;const raw=localStorage.getItem('genPrefill');
    if(raw){pf=JSON.parse(raw);localStorage.removeItem('genPrefill');}
    const p=q.get('prompt')||(pf&&pf.prompt);const ref=q.get('ref')||(pf&&pf.ref);
    if(p){_pv=[];setPromptVersion(p,'source',(pf&&pf.src)||'分析结果');if(pf&&pf.src){$('#srcTxt').textContent='来源：'+pf.src;$('#srcbar').classList.add('on');}}
    if(ref){_refs=[{url:ref}];renderRefs();}
  }catch(e){}}

// ── 参考图：点击上传 / 拖入(本地文件·网页图片) / 粘贴 URL，最多 4 张 ──
let _refs=[];   // [{url, uploading?}]
function renderRefs(){
  const g=$('#refgrid');g.innerHTML='';
  _refs.forEach((r,i)=>{
    const t=document.createElement('div');t.className='refthumb'+(r.uploading?' up':'');
    t.innerHTML=r.uploading?'上传中…':('<img src="'+esc(r.url)+'">'+(i===0?'<span class="first">首帧</span>':'')+'<button class="rm" onclick="removeRef('+i+')">✕</button>');
    g.appendChild(t);
  });
  const canAdd=_refs.length<4;
  $('#refadd').style.display=canAdd?'':'none';$('#refurl').style.display=canAdd?'':'none';
}
function removeRef(i){_refs.splice(i,1);renderRefs();}
function pickRefFile(){$('#reffile').click();}
function onRefFiles(e){[...(e.target.files||[])].forEach(f=>{if(f.type.startsWith('image/'))uploadRef(f);});e.target.value='';}
async function uploadRef(file){
  if(_refs.length>=4){alert('最多 4 张参考图');return;}
  const slot={url:'',uploading:true};_refs.push(slot);renderRefs();
  try{const fd=new FormData();fd.append('file',file);
    const r=await fetch('/gen/upload_image',{method:'POST',headers:headers(),body:fd});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||!d.url){_refs=_refs.filter(x=>x!==slot);alert((d&&d.detail)||'上传失败');}
    else{slot.url=d.url;slot.uploading=false;}
  }catch(e){_refs=_refs.filter(x=>x!==slot);alert('上传失败：'+e);}
  renderRefs();
}
function addRefUrlVal(url){url=(url||'').trim();if(!url)return;if(_refs.length>=4){alert('最多 4 张参考图');return;}_refs.push({url});renderRefs();}
function addRefUrl(){const el=$('#refurl');addRefUrlVal(el.value);el.value='';}
function wireRefzone(){
  const z=$('#refzone');
  ['dragenter','dragover'].forEach(ev=>z.addEventListener(ev,e=>{e.preventDefault();z.classList.add('drag');}));
  ['dragleave','drop'].forEach(ev=>z.addEventListener(ev,e=>{if(ev==='dragleave'&&z.contains(e.relatedTarget))return;z.classList.remove('drag');}));
  z.addEventListener('drop',e=>{e.preventDefault();const dt=e.dataTransfer;if(!dt)return;
    if(dt.files&&dt.files.length){[...dt.files].forEach(f=>{if(f.type.startsWith('image/'))uploadRef(f);});return;}
    let url=dt.getData('text/uri-list')||dt.getData('text/plain');
    if(!url){const html=dt.getData('text/html');const m=html&&html.match(/<img[^>]+src=["']([^"']+)/i);if(m)url=m[1];}
    if(url)addRefUrlVal(url.split('\n')[0].trim());
  });
}

// ── 抽屉宽度可拖拽 ──
function startDrawerResize(e,which){e.preventDefault();
  const varName=which==='pick'?'--pick-w':'--dt-w';document.body.style.userSelect='none';
  function mv(ev){let w=window.innerWidth-ev.clientX;w=Math.max(320,Math.min(w,window.innerWidth*0.9));
    document.documentElement.style.setProperty(varName,w+'px');}
  function up(){window.removeEventListener('mousemove',mv);window.removeEventListener('mouseup',up);document.body.style.userSelect='';}
  window.addEventListener('mousemove',mv);window.addEventListener('mouseup',up);
}

initRail();measureHdr();window.addEventListener('resize',measureHdr);
wireRefzone();
boot();
</script>
