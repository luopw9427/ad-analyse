<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>视频广告分析</title>
<style>
  :root{--bg:#0f1115;--card:#181b22;--line:#2a2f3a;--txt:#e6e8ec;--sub:#9aa0ab;--acc:#7f77dd;--ok:#4ecb8d;--warn:#e0995f}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,"Microsoft YaHei",sans-serif;font-size:14px}
  header{padding:14px 24px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;position:sticky;top:0;background:var(--bg);z-index:5}
  header h1{font-size:16px;margin:0 8px 0 0}
  input,select{background:var(--card);border:1px solid var(--line);color:var(--txt);padding:7px 10px;border-radius:6px;font-size:13px}
  button{background:var(--acc);border:0;color:#fff;padding:7px 14px;border-radius:6px;cursor:pointer;font-size:13px}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--sub)}
  main{padding:20px 24px;max-width:1100px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
  .card h2{font-size:15px;margin:0 0 12px}
  .card h3{font-size:13px;color:var(--sub);margin:14px 0 6px;font-weight:600}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0}
  label.ck{color:var(--sub);display:flex;gap:5px;align-items:center;font-size:13px}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{background:#22262f;border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:12px}
  .tag.pain{border-color:var(--warn);color:var(--warn)}
  .shots{display:flex;flex-wrap:wrap;gap:10px}
  .shots video{width:180px;border-radius:6px;background:#000;border:1px solid var(--line)}
  .prompt{position:relative;background:#12141a;border:1px solid var(--line);border-radius:6px;padding:10px;margin:6px 0;white-space:pre-wrap;font-size:12.5px;line-height:1.5;color:#cdd2da}
  .copy{position:absolute;top:6px;right:6px;padding:2px 8px;font-size:11px;background:#2a2f3a}
  .muted{color:var(--sub)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--sub);font-weight:600}
  .badge{padding:1px 8px;border-radius:10px;font-size:11px}
  .badge.done{background:rgba(78,203,141,.15);color:var(--ok)}
  .badge.error{background:rgba(224,153,95,.15);color:var(--warn)}
  .badge.run{background:rgba(127,119,221,.18);color:#a9a2ee}
  button.mini{padding:2px 8px;font-size:11px;background:#2a2f3a;margin-right:4px}
  button.mini.del{background:transparent;border:1px solid var(--warn);color:var(--warn)}
  td.ops{white-space:nowrap}
  #ops .log{background:#12141a;border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin-top:8px;font-size:12px;max-height:160px;overflow:auto;white-space:pre-wrap;color:#cdd2da}
  details{margin-top:8px}summary{cursor:pointer;color:var(--sub)}
</style>
</head>
<body>
<header>
  <h1>视频广告分析</h1>
  <input id="project" placeholder="项目名" value="test" size="10">
  <input id="product" placeholder="产品名" size="10">
  <input id="token" placeholder="访问口令" type="password" size="12">
  <button onclick="loadAll()">加载结果</button>
  <span id="status" class="muted"></span>
</header>
<main>
  <div class="card" id="ops">
    <h2>操作</h2>
    <div class="row">
      <b>① 上传拆分：</b>
      <input type="file" id="files" accept="video/*" multiple>
      <button id="btnSplit" onclick="doSplit()">上传并拆分</button>
      <label class="ck"><input type="checkbox" id="fast" checked> 快速切分(不重编码,快很多)</label>
      <span class="muted">文件名会作为广告 id</span>
    </div>
    <div class="row">
      <b>② 分析：</b>
      <button id="btnAnalyze" onclick="doAnalyze()">开始分析本项目</button>
      <label class="ck"><input type="checkbox" id="cc"> 生成横向对比</label>
      <label class="ck"><input type="checkbox" id="pro"> 用更强模型(Pro,贵)</label>
      <label class="ck"><input type="checkbox" id="ow"> 强制重跑</label>
    </div>
    <div class="row">
      <span class="muted">前置卖点（可选，逗号分隔，给分析模型作参考）：</span>
      <input id="hyp" placeholder="如：免养护,开箱即用,送礼首选" size="40">
    </div>
    <div class="log" id="opslog"></div>
  </div>

  <div class="card">
    <h2>存储管理 <span class="muted" style="font-weight:400;font-size:12px">· 删除后不可恢复</span></h2>
    <div class="row">
      <button class="ghost" onclick="doDelete(false,true)">仅删分析产物（保留切片）</button>
      <button class="ghost" onclick="doDelete(false,false)">删除整个项目（含切片）</button>
      <button class="ghost" onclick="clearJobs()">清空本项目任务记录</button>
    </div>
    <div class="row">
      <span class="muted">删除单条广告：</span>
      <input id="delAd" placeholder="广告 id，如 海马" size="14">
      <button class="ghost" onclick="doDelete(true,false)">删除该广告</button>
    </div>
  </div>

  <div class="card">
    <h2>任务记录 <button class="ghost" style="float:right;padding:3px 10px" onclick="loadJobs()">刷新</button></h2>
    <div id="jobs" class="muted">加载后显示</div>
  </div>
  <div id="results"></div>
</main>

<script>
const $=s=>document.querySelector(s);
const proj=()=>$('#project').value.trim();
const tok=()=>$('#token').value.trim();
const headers=()=>tok()?{'X-API-Token':tok()}:{};
const setStatus=t=>$('#status').textContent=t||'';
$('#token').value=localStorage.getItem('tok')||'';
$('#project').value=localStorage.getItem('proj')||'test';
$('#product').value=localStorage.getItem('prod')||'';
$('#hyp').value=localStorage.getItem('hyp')||'';
function remember(){localStorage.setItem('tok',tok());localStorage.setItem('proj',proj());localStorage.setItem('prod',$('#product').value.trim());localStorage.setItem('hyp',$('#hyp').value.trim())}

function setOps(t){$('#status').textContent=t||''}
function logOps(t){const l=$('#opslog');l.textContent+=t+'\n';l.scrollTop=l.scrollHeight}

async function api(path){const r=await fetch(path,{headers:headers()});if(!r.ok)throw new Error(path+' -> '+r.status);return r.json()}

// 轮询 /jobs 直到指定任务完成，返回该任务
async function waitJob(jid,onTick){
  while(true){
    await new Promise(r=>setTimeout(r,4000));
    try{
      const jd=await api('/jobs?limit=40');
      loadJobs();
      const job=(jd.jobs||[]).find(j=>j.id===jid);
      if(job && job.status!=='running') return job;
      if(onTick)onTick();
    }catch(e){}
  }
}

// ===== 操作 =====
async function doSplit(){
  remember();const files=$('#files').files;
  if(!files.length){alert('先选视频文件');return}
  if(!tok()){alert('先填访问口令');return}
  $('#btnSplit').disabled=true;
  for(let i=0;i<files.length;i++){
    const f=files[i];
    setStatus(`拆分 ${i+1}/${files.length}: ${f.name}（后台运行）…`);
    logOps('▶ 提交拆分 '+f.name+' …');
    const fd=new FormData();fd.append('project_id',proj());
    fd.append('ad_id',f.name.replace(/\.[^.]+$/,''));fd.append('precise',$('#fast').checked?'false':'true');fd.append('file',f);
    try{
      const r=await fetch('/split',{method:'POST',headers:headers(),body:fd});
      const d=await r.json();
      if(!d.started){logOps('✗ 提交失败 '+f.name+' '+(d.error||r.status));continue}
      const job=await waitJob(d.job_id);
      logOps((job.ok?'✓':'✗')+' 拆分 '+f.name+(job.ok?`  ${(job.detail||'').replace(' shots','')} 个镜头`:'  失败: '+(job.detail||'')));
    }catch(e){logOps('✗ 拆分 '+f.name+'  '+e.message)}
  }
  setStatus('拆分完成');$('#btnSplit').disabled=false;loadJobs();
}

async function doAnalyze(){
  remember();if(!tok()){alert('先填访问口令');return}
  $('#btnAnalyze').disabled=true;
  const body={project_id:proj(),product:$('#product').value.trim()||'产品',
    cross_compare:$('#cc').checked,pro:$('#pro').checked,overwrite:$('#ow').checked,
    hypotheses:$('#hyp').value.trim()||null};
  setStatus('提交分析…');logOps('▶ 提交分析项目 '+proj()+' …');
  let jid=null;
  try{
    const r=await fetch('/analyze',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    if(!d.started){logOps('✗ 启动失败');setStatus('启动失败');$('#btnAnalyze').disabled=false;return}
    jid=d.job_id;
    logOps('▶ 已在后台开始（任务#'+jid+'），分析中…可以离开，稍后回来看');
  }catch(e){logOps('✗ 提交失败 '+e.message);setStatus('提交失败');$('#btnAnalyze').disabled=false;return}

  setStatus('分析中…（后台运行，自动刷新）');
  const timer=setInterval(async()=>{
    try{
      const jd=await api('/jobs?limit=30');
      const job=(jd.jobs||[]).find(j=>j.id===jid);
      if(job && job.status!=='running'){
        clearInterval(timer);$('#btnAnalyze').disabled=false;
        logOps(job.ok?('✓ 分析完成（#'+jid+'，'+job.duration_sec+'s）'):('✗ 分析失败（#'+jid+'）'));
        setStatus(job.ok?'分析完成':'分析失败');
        if(job.ok)loadAll();else loadJobs();
      }else{loadJobs()}
    }catch(e){}
  },5000);
}

// ===== 查看 =====
function copyBtn(t){const b=document.createElement('button');b.className='copy';b.textContent='复制';b.onclick=()=>{navigator.clipboard.writeText(t);b.textContent='已复制';setTimeout(()=>b.textContent='复制',1200)};return b}
function promptBlock(t){const d=document.createElement('div');d.className='prompt';d.textContent=t;d.appendChild(copyBtn(t));return d}
function tags(a,cls){const w=document.createElement('div');w.className='tags';(a||[]).forEach(t=>{const s=document.createElement('span');s.className='tag'+(cls?' '+cls:'');s.textContent=t;w.appendChild(s)});return w}

async function viewJob(kind,ref){
  await loadAll();
  if(ref){
    const el=document.getElementById('ad-'+ref);
    if(el){el.scrollIntoView({behavior:'smooth',block:'start'});el.style.outline='2px solid var(--acc)';
      setTimeout(()=>el.style.outline='',2000);}
    else logOps('（结果里没有「'+ref+'」这条广告，可能已删除或尚未分析）');
  }
}

async function delJob(id,kind,ref){
  if(!tok()){alert('先填访问口令');return}
  let msg,delReq=null;
  if(kind==='split'&&ref){
    msg='删除任务 #'+id+'（拆分 '+ref+'）\n\n将一并删除广告「'+ref+'」在 R2 的全部文件：\n· 镜头切片\n· 该广告的分析产物\n\n不可恢复，确定？';
    delReq={project_id:proj(),ad_id:ref,analysis_only:false,clear_jobs:false};
  }else if(kind==='analyze'){
    msg='删除任务 #'+id+'（分析 '+ref+'）\n\n将一并删除项目「'+proj()+'」的分析产物：\n· 各广告的 analysis_output\n· 共性镜头prompt / 横向对比\n（视频切片保留）\n\n不可恢复，确定？';
    delReq={project_id:proj(),ad_id:null,analysis_only:true,clear_jobs:false};
  }else{
    msg='删除任务记录 #'+id+'？';
  }
  if(!confirm(msg))return;

  if(delReq){
    try{
      const r=await fetch('/delete',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},
        body:JSON.stringify(delReq)});
      const d=await r.json();
      logOps(d.ok?('✓ 已删除 R2 文件 '+d.deleted+' 个（'+d.scope+'）'):('✗ 删文件失败 '+(d.detail||r.status)));
    }catch(e){logOps('✗ 删文件失败 '+e.message)}
  }
  try{
    await fetch('/jobs/delete',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},
      body:JSON.stringify({job_id:id})});
    logOps('✓ 已删除任务记录 #'+id);
  }catch(e){logOps('✗ 删记录失败 '+e.message)}
  loadJobs();loadAll();
}

async function doDelete(single,analysisOnly){
  remember();if(!tok()){alert('先填访问口令');return}
  const ad=single?$('#delAd').value.trim():'';
  if(single&&!ad){alert('先填要删除的广告 id');return}
  const what=analysisOnly?'分析产物':(single?('广告 '+ad+' 的全部文件'):('整个项目 '+proj()+' 的全部文件'));
  if(!confirm('确定删除 '+what+' ？此操作不可恢复。'))return;
  try{
    const r=await fetch('/delete',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},
      body:JSON.stringify({project_id:proj(),ad_id:ad||null,analysis_only:analysisOnly,clear_jobs:false})});
    const d=await r.json();
    logOps(d.ok?('✓ 已删除 '+d.deleted+' 个对象（'+d.scope+'）'):('✗ 删除失败 '+(d.detail||r.status)));
    loadAll();
  }catch(e){logOps('✗ 删除失败 '+e.message)}
}
async function clearJobs(){
  if(!confirm('清空项目 '+proj()+' 的任务记录？'))return;
  try{
    const r=await fetch('/delete',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},
      body:JSON.stringify({project_id:proj(),analysis_only:true,ad_id:'__none__',clear_jobs:true})});
    const d=await r.json();logOps('✓ 已清理任务记录 '+d.jobs_deleted+' 条');loadJobs();
  }catch(e){logOps('✗ 清理失败 '+e.message)}
}

async function loadJobs(){
  try{const d=await api('/jobs?limit=30');
    if(!d.db_enabled){$('#jobs').innerHTML='<span class="muted">数据库未启用</span>';return}
    if(!d.jobs.length){$('#jobs').innerHTML='<span class="muted">暂无记录</span>';return}
    let h='<table><tr><th>ID</th><th>类型</th><th>项目</th><th>对象</th><th>状态</th><th>耗时(s)</th><th>时间</th><th>操作</th></tr>';
    d.jobs.forEach(j=>{const cls=j.status==='done'?'done':(j.status==='error'?'error':'run');h+=`<tr><td>${j.id}</td><td>${j.kind}</td><td>${j.project_id}</td><td>${j.ref||''}</td><td><span class="badge ${cls}">${j.status}</span></td><td>${j.duration_sec||''}</td><td class="muted">${(j.created_at||'').slice(0,19)}</td><td class="ops"><button class="mini" onclick="viewJob('${(j.kind||'')}','${(j.ref||'').replace(/'/g,"\\'")}')">查看</button><button class="mini del" onclick="delJob(${j.id},'${(j.kind||'')}','${(j.ref||'').replace(/'/g,"\\'")}')">删除</button></td></tr>`});
    $('#jobs').innerHTML=h+'</table>';
  }catch(e){$('#jobs').innerHTML='<span class="muted">加载失败：'+e.message+'</span>'}
}

function adFromKey(k,pid){const rest=k.replace('projects/'+pid+'/','');const p=rest.split('/');return p.length>=2?p[0]:null}

async function loadAll(){
  remember();setStatus('加载中…');$('#results').innerHTML='';await loadJobs();
  let data;try{data=await api('/result?project_id='+encodeURIComponent(proj()))}catch(e){setStatus('加载失败：'+e.message);return}
  setStatus('共 '+data.count+' 个对象');
  const pid=proj();const ads={};let common=null;
  for(const [k,v] of Object.entries(data.reports||{})){
    if(k.endsWith('共性镜头prompt.json')){common=v;continue}
    const ad=adFromKey(k,pid);if(!ad)continue;ads[ad]=ads[ad]||{};
    if(k.endsWith('ad_aggregate.json'))ads[ad].agg=v;
    else if(k.endsWith('video_prompt.json'))ads[ad].vp=v;
    else if(k.endsWith('shot_prompts.json'))ads[ad].sp=v;
  }
  const vids={};(data.objects||[]).forEach(o=>{if(o.key.endsWith('.mp4')){const ad=adFromKey(o.key,pid);if(ad)(vids[ad]=vids[ad]||[]).push(o.url)}});
  const root=$('#results');
  for(const [ad,d] of Object.entries(ads))root.appendChild(renderAd(ad,d,vids[ad]||[]));
  if(common)root.appendChild(renderCommon(common));
}

function renderAd(ad,d,videos){
  const c=document.createElement('div');c.className='card';c.id='ad-'+ad;const agg=d.agg||{},vp=d.vp||{},sp=d.sp||{};
  c.innerHTML=`<h2>广告：${ad} <span class="muted" style="font-weight:400">· ${agg.total_duration||'?'}s · ${(vp.广告结构分类&&vp.广告结构分类.主结构)||''}</span></h2>`;
  if(agg.广告主张){const p=document.createElement('div');p.innerHTML='<b>主张：</b>'+agg.广告主张;c.appendChild(p)}
  if(videos.length){const h=document.createElement('h3');h.textContent='镜头切片';c.appendChild(h);const w=document.createElement('div');w.className='shots';videos.forEach(u=>{const v=document.createElement('video');v.src=u;v.controls=true;w.appendChild(v)});c.appendChild(w)}
  if(agg.商品卖点){const h=document.createElement('h3');h.textContent='卖点';c.appendChild(h);c.appendChild(tags(agg.商品卖点))}
  if(agg.解决痛点){const h=document.createElement('h3');h.textContent='痛点';c.appendChild(h);c.appendChild(tags(agg.解决痛点,'pain'))}
  if(vp.video_prompt_text){const h=document.createElement('h3');h.textContent='视频级脚本 prompt';c.appendChild(h);c.appendChild(promptBlock(vp.video_prompt_text))}
  const list=(sp.镜头级prompt列表||[]);
  if(list.length){const h=document.createElement('h3');h.textContent='镜头 prompt 素材（'+list.length+' 条）';c.appendChild(h);const det=document.createElement('details');det.innerHTML='<summary>展开查看</summary>';list.forEach(it=>{const t=document.createElement('div');t.style.marginTop='8px';t.innerHTML='<b>'+(it.标题||it.id||'')+'</b>';det.appendChild(t);det.appendChild(tags(it.卖点));det.appendChild(promptBlock(it.prompt||''))});c.appendChild(det)}
  return c;
}
function renderCommon(v){
  const c=document.createElement('div');c.className='card';
  c.innerHTML=`<h2>品类共性镜头库 · ${v.品类||''} <span class="muted" style="font-weight:400">（${(v.共性镜头prompt列表||[]).length} 条）</span></h2>`;
  if(v.商品共性卖点)c.appendChild(tags(v.商品共性卖点));
  (v.共性镜头prompt列表||[]).forEach(it=>{const t=document.createElement('div');t.style.marginTop='10px';t.innerHTML='<b>'+(it.标题||it.id||'')+'</b>';c.appendChild(t);c.appendChild(tags(it.卖点));c.appendChild(promptBlock(it.prompt||''))});
  return c;
}
</script>
</body>
</html>
