<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>视频广告分析</title>
<style>
  :root{
    --bg:#eef2f8; --panel:#ffffff; --panel-2:#f7f9fc;
    --ink:#1b2431; --ink-2:#57617340; --sub:#5a6678; --muted:#9aa6b6;
    --line:#e7ecf3; --line-2:#dde4ee;
    --accent:#2f6bed; --accent-ink:#1e51c4; --accent-weak:#eaf1fe;
    --ok:#15a34a; --ok-bg:#e9f7ee; --warn:#c26a12; --warn-bg:#fbf1e2;
    --run:#5a52d8; --run-bg:#eeecfb; --pain:#c0561f; --pain-bg:#fbeee4;
    --r:14px; --r-sm:9px;
    --sh:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.05);
    --sh-sm:0 1px 2px rgba(16,24,40,.05);
  }
:root{--drawer-w:50vw}
  *{box-sizing:border-box}
  body{margin:0;background:#edf1f7;color:var(--ink);
       font-family:-apple-system,"Segoe UI",system-ui,"Microsoft YaHei",sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
  #scroll{background:#edf1f7}

  header{padding:14px 28px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
         border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;
         position:fixed;top:0;left:0;right:0;z-index:40;box-shadow:0 1px 0 rgba(16,24,40,.02)}
  header h1{font-size:16px;margin:0 14px 0 0;font-weight:700;letter-spacing:.2px;
            background:linear-gradient(90deg,#2f6bed,#5a52d8);-webkit-background-clip:text;background-clip:text;color:transparent}
  header .muted{font-size:12px;color:var(--sub)}

  input,select{background:#fff;border:1px solid var(--line-2);color:var(--ink);
    padding:8px 11px;border-radius:var(--r-sm);font-size:13px;outline:none;transition:.15s}
  input::placeholder{color:var(--muted)}
  input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}

  button{background:#fff;border:1px solid var(--line-2);color:var(--ink);padding:8px 16px;border-radius:var(--r-sm);
    cursor:pointer;font-size:13px;font-weight:600;transition:.15s;box-shadow:var(--sh-sm)}
  button:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
  button:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
  .iconbtn{background:transparent;border:0;box-shadow:none;color:var(--sub);padding:5px 7px;font-size:15px;
    line-height:1;border-radius:7px;font-weight:400}
  .iconbtn:hover{background:var(--accent-weak);color:var(--accent)}
  .iconbtn.on{background:var(--accent-weak);color:var(--accent)}
  button.ghost{background:#fff;border:1px solid var(--line-2);color:var(--sub);font-weight:500;box-shadow:none}
  button.ghost:hover{background:var(--accent-weak);border-color:var(--accent);color:var(--accent)}
  button.eye{background:#fff;border:1px solid var(--line-2);color:var(--sub);padding:6px 9px;font-size:13px;box-shadow:none}
  button.eye:hover{background:var(--accent-weak);color:var(--accent);border-color:var(--accent)}
  button.mini{padding:3px 10px;font-size:11.5px;background:var(--panel-2);color:var(--sub);
    border:1px solid var(--line-2);margin-right:5px;font-weight:500;box-shadow:none}
  button.mini:hover{background:var(--accent-weak);border-color:var(--accent);color:var(--accent)}
  button.mini.del{background:#fff;border-color:#f0c9bb;color:var(--pain)}
  button.mini.del:hover{background:var(--pain-bg)}

  main{padding:24px 28px 60px;max-width:1120px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:20px 22px;margin-bottom:18px;box-shadow:var(--sh)}
  .card h2{font-size:15px;margin:0 0 14px;font-weight:700;display:flex;align-items:center;gap:9px}
  .card h2::before{content:"";width:4px;height:15px;border-radius:3px;
    background:linear-gradient(180deg,#2f6bed,#5a52d8);display:inline-block}
  .card h3{font-size:12px;color:var(--sub);margin:16px 0 7px;font-weight:600;letter-spacing:.3px;text-transform:none}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
  .row>b{color:var(--ink);font-weight:600}
  label.ck{color:var(--sub);display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}
  label.ck input{accent-color:var(--accent)}

  .tags{display:flex;flex-wrap:wrap;gap:7px}
  .tag{background:var(--accent-weak);border:1px solid #d7e4fd;color:var(--accent-ink);
    border-radius:20px;padding:4px 12px;font-size:12px;font-weight:500}
  .tag.pain{background:var(--pain-bg);border-color:#f2d3c3;color:var(--pain)}

  .shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
  #drawer .shots{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
  .shots video{width:100%;height:auto;border-radius:8px;background:#000;border:1px solid var(--line-2);box-shadow:var(--sh-sm)}

  .prompt{position:relative;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
    padding:12px 12px;margin:7px 0;white-space:pre-wrap;font-size:12.5px;line-height:1.6;color:#2c3644}
  .copy{position:absolute;top:7px;right:7px;padding:3px 9px;font-size:11px;background:#fff;
    border:1px solid var(--line-2);color:var(--sub);box-shadow:none}
  .copy:hover{background:var(--accent-weak);color:var(--accent)}
  .muted{color:var(--muted)}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
  thead th,tr:first-child th{color:var(--sub);font-weight:600;background:var(--panel-2);
    border-bottom:1px solid var(--line-2)}
  tbody tr:hover,table tr:hover{background:var(--panel-2)}
  td.ops{white-space:nowrap}
  /* 任务记录：不随右边栏挤压而缩排，保持最小宽度、剩余区域横向滚动看全 */
  #jobs{overflow-x:auto}
  #jobs table{min-width:1040px}
  #jobs th{white-space:nowrap}
  .objw{display:inline-block;max-width:168px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
  .objw .obj{white-space:nowrap;transition:transform .3s}

  .badge{padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600}
  .badge.done{background:var(--ok-bg);color:var(--ok)}
  .badge.error{background:var(--pain-bg);color:var(--pain)}
  .badge.run{background:var(--run-bg);color:var(--run)}

  #ops .log,#opslog{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;margin-top:10px;font-size:12px;max-height:170px;overflow:auto;
    white-space:pre-wrap;color:#3a4557;font-family:"SFMono-Regular",Consolas,monospace}

  details{margin-top:8px}
  details>summary{cursor:pointer;color:var(--sub);font-weight:600;font-size:12.5px;
    list-style:none;user-select:none;padding:3px 0}
  details>summary::-webkit-details-marker{display:none}
  details>summary::before{content:"▸";color:var(--accent);margin-right:7px;font-size:11px}
  details[open]>summary::before{content:"▾"}
  details>summary:hover{color:var(--accent)}
  summary.ad-sum{font-size:14px;color:var(--ink);padding:2px 0 8px}
  details.pi{margin-left:18px;padding-left:12px;border-left:2px solid var(--line-2);margin-top:6px}
  details.pi>summary{color:var(--ink)}
  .bi-tabs{display:inline-flex;gap:1px;background:var(--line-2);border-radius:6px;padding:1px;vertical-align:middle}
  .bi-tabs button{border:0;background:transparent;color:var(--muted);font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:5px;cursor:pointer;line-height:1.5}
  .bi-tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.12)}
  .bi-en-wait{color:var(--muted);padding:8px 2px;font-size:13px}
  .bi-en-wait::before{content:"⏳ "}
  .fav-star{border:0;background:transparent;cursor:pointer;color:#c9ccd4;font-size:15px;line-height:1;padding:2px 4px;vertical-align:middle}
  .fav-star:hover{color:#f4b400}
  .fav-star.on{color:#f4b400}
  .fav-clip{position:absolute;top:4px;right:4px;z-index:2;background:rgba(255,255,255,.85);border-radius:6px}
  .fav-row{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;position:relative}
  .fav-row .rm{position:absolute;top:8px;right:10px}
  .fav-kind-h{font-size:12px;color:var(--sub);font-weight:600;margin:14px 0 6px}
  /* 结果栏（Claude 风格并列侧栏）——默认打开、1/4 宽、位于顶栏之下、比顶栏略矮 */
  #drawer{position:fixed;top:calc(var(--hdr-h,56px) + 6px);right:8px;bottom:10px;
    width:var(--drawer-w);z-index:30;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;box-shadow:-8px 12px 36px rgba(16,24,40,.14);overflow:hidden;
    display:flex;flex-direction:column;
    transform:translateX(calc(100% + 20px));transition:transform .26s ease,width .18s ease}
  body.drawer-open #drawer{transform:translateX(0)}
  body.drawer-full #drawer{right:8px;left:8px;width:auto}
  #drawerToolbar{display:flex;align-items:center;gap:2px;padding:6px 8px;border-bottom:1px solid var(--line);flex:0 0 auto}
  #drawerBody{flex:1 1 auto;overflow-y:auto;padding:16px 18px 48px}
  #drawerGrip{position:absolute;left:0;top:0;width:7px;height:100%;cursor:ew-resize;z-index:3}
  #drawerGrip:hover{background:var(--accent-weak)}
  #drawerReopen{position:fixed;top:calc(var(--hdr-h,56px) + 10px);right:10px;z-index:29;
    width:34px;height:34px;border:1px solid var(--line-2);border-radius:9px;background:var(--panel);
    color:var(--sub);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:var(--sh-sm)}
  #drawerReopen:hover{background:var(--panel-2);color:var(--ink)}
  body.drawer-open #drawerReopen{display:none}
  #drawer .card{box-shadow:none;border:1px solid var(--line);padding:14px 16px;margin-bottom:14px}
  /* 主区滚动容器：滚动条落在被挤压主区右缘（右边栏左侧） */
  #scroll{position:fixed;left:0;right:0;top:var(--hdr-h,56px);bottom:0;overflow-y:auto;overflow-x:hidden;transition:right .26s ease}
  body.drawer-open #scroll{right:calc(var(--drawer-w) + 16px)}
  body.drawer-full #scroll{right:0}
  /* 滚动条：默认透明，悬停时才显现 */
  #scroll::-webkit-scrollbar,#drawerBody::-webkit-scrollbar,#jobs::-webkit-scrollbar,#opslog::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:transparent;border-radius:8px}
  :hover::-webkit-scrollbar-thumb{background:rgba(120,132,150,.30)}
  ::-webkit-scrollbar-thumb:hover{background:rgba(120,132,150,.55)}
  *{scrollbar-width:thin;scrollbar-color:transparent transparent}
  *:hover{scrollbar-color:rgba(120,132,150,.35) transparent}
  /* 切片悬停操作条 + 小窗播放 */
  .clipcell{position:relative}
  .clipcell .clipbar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:6px;justify-content:center;padding:6px;
    background:linear-gradient(transparent,rgba(0,0,0,.5));opacity:0;transition:.15s;border-radius:0 0 8px 8px}
  .clipcell:hover .clipbar{opacity:1}
  .clipcell .clipbar button{background:rgba(255,255,255,.94);border:0;color:#1b2431;padding:4px 10px;font-size:12px;border-radius:7px;font-weight:600;box-shadow:none}
  .clipcell .clipbar button:hover{background:#fff}
  .pi-ctl{float:right;display:inline-flex;gap:2px;align-items:center}
  #clipModal{position:fixed;inset:0;z-index:80;background:rgba(16,24,40,.55);display:none;align-items:center;justify-content:center}
  #clipModal.on{display:flex}
  #clipModal .box{background:#000;border-radius:12px;overflow:hidden;max-width:460px;width:90%;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  #clipModal video{width:100%;display:block;max-height:76vh;background:#000}
  #clipModal .x{position:absolute;top:8px;right:8px;z-index:2;background:rgba(255,255,255,.92);border:0;color:#1b2431;border-radius:8px;padding:4px 10px;font-weight:600}
</style>
</head>
<body>
<header>
  <h1>视频广告分析</h1>
  <span class="muted">OpenRouter Key</span>
  <input id="orkey" placeholder="留空=用服务端密钥" type="password" size="16"
         title="留空即可：默认使用服务端(Railway 变量)里配置的 OpenRouter 密钥。只有想临时换一把 key 时才填，填了只保存在你本地浏览器，不会上传保存">
  <button class="eye" onclick="toggleEye('orkey',this)" title="显示/隐藏">👁</button>
  <span class="muted">DeepSeek Key</span>
  <input id="dskey" placeholder="留空=用服务端密钥" type="password" size="16"
         title="翻译（中→英）用的 DeepSeek 密钥。留空即用服务端(Railway 变量)里的 DEEPSEEK_API_KEY。填了只存本地浏览器，不上传保存">
  <button class="eye" onclick="toggleEye('dskey',this)" title="显示/隐藏">👁</button>
  <span class="muted">项目名</span>
  <input id="project" placeholder="如 test" size="10"
         title="一批广告用同一个项目名。R2 里按 projects/{项目名}/{广告}/ 存放，分析和横向对比也按项目为单位">
  <span class="muted">访问口令</span>
  <input id="token" placeholder="APP_TOKEN" type="password" size="10"
         title="服务端设置的 APP_TOKEN，用于调用接口鉴权。填一次会记住">
  <button class="eye" onclick="toggleEye('token',this)" title="显示/隐藏">👁</button>
  <button onclick="loadAll()">加载结果</button>
  <span id="status" class="muted"></span>
  <button onclick="location.href='/prompts'" style="margin-left:auto" title="自定义各环节分析提示词（存本机浏览器）">提示词修改</button>
</header>
<div id="scroll">
<main>
  <div class="card" id="ops">
    <h2>操作</h2>
    <div class="row">
      <b>① 上传拆分：</b>
      <input type="file" id="files" accept="video/*" multiple>
      <button id="btnSplit" onclick="doSplit()">上传并拆分</button>
      <span class="muted">引擎</span>
      <select id="engine">
        <option value="gpu">GPU (Modal·快)</option>
        <option value="cpu">CPU (Railway·慢)</option>
      </select>
      <label class="ck"><input type="checkbox" id="fast"> 快速切分(不重编码·可能重复/不准)</label>
      <label class="ck"><input type="checkbox" id="keepraw"> 保留原视频</label>
      <span class="muted">文件名会作为广告 id</span>
    </div>
    <div class="row">
      <b style="visibility:hidden">①</b>
      <span class="muted">或粘贴视频直链</span>
      <input id="vurl" placeholder="https://…/xxx.mp4，一次一个" size="34">
      <button class="ghost" onclick="addUrl()">添加到本批</button>
      <span id="urlchips" class="tags"></span>
    </div>
    <div class="row">
      <b>② 分析：</b>
      <button id="btnAnalyze" onclick="doAnalyze()">开始分析本批次</button>
      <label class="ck"><input type="checkbox" id="cc"> 生成横向对比</label>
      <label class="ck"><input type="checkbox" id="pro"> 用更强模型(Pro,贵)</label>
      <label class="ck"><input type="checkbox" id="ow"> 强制重跑</label>
    </div>
    <div class="row">
      <span class="muted">产品名</span>
      <input id="product" placeholder="如 钻石画" size="14"
             title="这批广告卖的产品，作为提示传给分析模型（只影响分析，不影响拆分）">
      <span class="muted">前置卖点（可选）</span>
      <input id="hyp" placeholder="如：免养护,开箱即用,送礼首选" size="32"
             title="已知的卖点，逗号分隔。供分析模型参考验证，可留空">
    </div>
    <div class="log" id="opslog"></div>
  </div>

  <div class="card">
    <h2>存储管理 <span class="muted" style="font-weight:400;font-size:12px">· 删除后不可恢复</span></h2>
    <div class="row">
      <button class="ghost" onclick="doDelete(false,true)">仅删分析产物（保留切片）</button>
      <button class="ghost" onclick="doDelete(false,false)">删除整个项目（含切片）</button>
      <button class="ghost" onclick="clearJobs()">清空本项目任务记录</button>
    </div>
    <div class="row">
      <span class="muted">删除批次：</span>
      <input id="delBatch" placeholder="批次 id，如 20260722-153012" size="20">
      <button class="ghost" onclick="doDeleteBatch()">删除该批次</button>
    </div>
  </div>

  <div class="card">
    <h2>任务记录 <button class="ghost" style="float:right;padding:3px 10px" onclick="loadJobs()">刷新</button></h2>
    <div id="jobs" class="muted">加载后显示</div>
  </div>
  <div id="results"></div>
</main>

</div><!--/scroll-->
<button id="drawerReopen" title="打开结果栏" onclick="openDrawer()">▤</button>
<div id="drawer">
  <div id="drawerGrip" title="拖动调整宽度"></div>
  <div id="drawerToolbar">
    <button class="iconbtn" id="dic-all" title="全部结果" onclick="setDrawerMode('all')">▤</button>
    <button class="iconbtn" id="dic-fav" title="我的收藏" onclick="setDrawerMode('fav')">★</button>
    <span style="flex:1"></span>
    <button class="iconbtn" id="dic-full" title="全屏 / 退出全屏" onclick="toggleDrawerFull()">⛶</button>
    <button class="iconbtn" title="关闭结果栏" onclick="closeDrawer()">✕</button>
  </div>
  <div id="drawerBody"></div>
</div>
<div id="clipModal" onclick="closeClip(event)"><div class="box"><button class="x" onclick="closeClip()">✕</button><video id="clipVideo" controls playsinline></video></div></div>
<script>
const $=s=>document.querySelector(s);
const proj=()=>$('#project').value.trim();
function toggleEye(id,btn){const el=$('#'+id);const show=el.type==='password';el.type=show?'text':'password';btn.textContent=show?'🙈':'👁'}
const tok=()=>$('#token').value.trim();
const headers=()=>tok()?{'X-API-Token':tok()}:{};
const setStatus=t=>$('#status').textContent=t||'';
$('#token').value=localStorage.getItem('tok')||'';
$('#project').value=localStorage.getItem('proj')||'test';
$('#product').value=localStorage.getItem('prod')||'';
$('#hyp').value=localStorage.getItem('hyp')||'';
$('#engine').value=localStorage.getItem('eng')||'gpu';
$('#orkey').value=localStorage.getItem('ork')||'';
$('#dskey').value=localStorage.getItem('dsk')||'';
function remember(){localStorage.setItem('tok',tok());localStorage.setItem('proj',proj());localStorage.setItem('prod',$('#product').value.trim());localStorage.setItem('hyp',$('#hyp').value.trim());localStorage.setItem('eng',$('#engine').value);localStorage.setItem('ork',$('#orkey').value.trim());localStorage.setItem('dsk',$('#dskey').value.trim())}

function setOps(t){$('#status').textContent=t||''}
function logOps(t){const l=$('#opslog');l.textContent+=t+'\n';l.scrollTop=l.scrollHeight}

async function api(path){const r=await fetch(path,{headers:headers()});if(!r.ok)throw new Error(path+' -> '+r.status);return r.json()}

// 轮询 /jobs 直到指定任务完成，返回该任务
async function waitJob(jid,onTick){
  while(true){
    await new Promise(r=>setTimeout(r,4000));
    try{
      const jd=await api('/jobs?limit=40');
      loadJobs();
      const job=(jd.jobs||[]).find(j=>j.id===jid);
      if(job && job.status!=='running') return job;
      if(onTick)onTick();
    }catch(e){}
  }
}

// ===== 操作 =====
async function doSplit(){
  remember();const files=$('#files').files;
  const total=files.length+_urlList.length;
  if(!total){alert('先选视频文件或粘贴视频 URL');return}
  if(!tok()){alert('先填访问口令');return}
  $('#btnSplit').disabled=true;
  const batch=newBatchId();_curBatch=batch;localStorage.setItem('curBatch',batch);
  logOps('▶ 本次批次：'+batch+'（'+files.length+' 本地 + '+_urlList.length+' URL，合为一个任务）');
  const fd=new FormData();fd.append('project_id',proj());fd.append('batch',batch);
  fd.append('engine',$('#engine').value);fd.append('precise',$('#fast').checked?'false':'true');
  fd.append('keep_raw',$('#keepraw').checked?'true':'false');
  for(let i=0;i<files.length;i++)fd.append('files',files[i]);
  if(_urlList.length)fd.append('urls',JSON.stringify(_urlList));
  setStatus('上传拆分中…（'+total+' 个视频，后台运行）');
  try{
    const r=await fetch('/split_batch',{method:'POST',headers:headers(),body:fd});
    const d=await r.json();
    if(!d.started){logOps('✗ 提交失败 '+(d.error||r.status));$('#btnSplit').disabled=false;setStatus('提交失败');return}
    logOps('▶ 已提交批次拆分（任务#'+d.job_id+'，'+d.n+' 个视频），处理中…可离开');
    const job=await waitJob(d.job_id);

async function doAnalyze(){

  $('#btnAnalyze').disabled=true;
  const batch=_curBatch||localStorage.getItem('curBatch')||'';
  if(!batch){ if(!confirm('本次没有先上传拆分，未指定批次。\n确定分析整个项目（会把项目内所有批次一起归纳共性）？'))return; }
  const body={project_id:proj(),product:$('#product').value.trim()||'产品',
    cross_compare:$('#cc').checked,pro:$('#pro').checked,overwrite:$('#ow').checked,
    hypotheses:$('#hyp').value.trim()||null,
    openrouter_key:$('#orkey').value.trim()||null,
    deepseek_key:$('#dskey').value.trim()||null,
    batch:batch||null,
    custom_prompts:(()=>{try{const o=JSON.parse(localStorage.getItem('customPrompts')||'{}');return Object.keys(o).length?o:null}catch(e){return null}})()};
  setStatus('提交分析…');logOps('▶ 提交分析 '+(batch?('批次 '+batch):('整个项目 '+proj()))+' …');
  let jid=null;
  try{
    const r=await fetch('/analyze',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify(body)});

// 拉取并解析 /result，按「批次」分组缓存到 _res
function parseKey(k,pid){
  const rest=k.slice(('projects/'+pid+'/').length);
  const parts=rest.split('/');
  if(parts.length<2)return null;
  // projects/{pid}/{batch}/共性镜头prompt.json → depth2, ad=null
  // projects/{pid}/{batch}/{ad}/... → depth>=3
  return {batch:parts[0], ad:(parts.length>=3?parts[1]:null), last:parts[parts.length-1]};
}
// 把一次 /result 响应合并进 _res.batches（可多次调用做增量填充）
function _mergeResult(data){
  const pid=proj();
  if(!_res)_res={batches:{},count:0};
  const batches=_res.batches;
  const B=b=>batches[b]||(batches[b]={ads:{},vids:{},common:null});
  for(const [k,v] of Object.entries(data.reports||{})){
    const info=parseKey(k,pid);if(!info)continue;
    if(k.endsWith('共性镜头prompt.en.json')&&info.ad===null){B(info.batch).common_en=v;continue}
    if(k.endsWith('共性镜头prompt.json')&&info.ad===null){B(info.batch).common=v;continue}
    if(!info.ad)continue;
    const bo=B(info.batch);const A=bo.ads[info.ad]||(bo.ads[info.ad]={});
    if(k.endsWith('ad_aggregate.en.json'))A.agg_en=v;
    else if(k.endsWith('video_prompt.en.json'))A.vp_en=v;
    else if(k.endsWith('shot_prompts.en.json'))A.sp_en=v;
    else if(k.endsWith('ad_aggregate.json'))A.agg=v;
    else if(k.endsWith('video_prompt.json'))A.vp=v;
    else if(k.endsWith('shot_prompts.json'))A.sp=v;
    else if(k.endsWith('source.json'))A.source=(v&&v.url)||'';
  }
  (data.objects||[]).forEach(o=>{if(o.key.endsWith('.mp4')){const info=parseKey(o.key,pid);if(info&&info.ad){const bo=B(info.batch);if(!bo.ads[info.ad])bo.ads[info.ad]={};(bo.vids[info.ad]=bo.vids[info.ad]||[]);if(!bo.vids[info.ad].includes(o.url))bo.vids[info.ad].push(o.url)}}});
  if(data.count)_res.count=Math.max(_res.count||0,data.count);
}
async function ensureResult(force){
  if(_res&&!force)return _res;
  let data;try{data=await api('/result?project_id='+encodeURIComponent(proj()))}
  catch(e){_res=null;
    if((''+e.message).includes('404')){setStatus('该项目不存在或暂无产物');$('#results').innerHTML='<div class="muted" style="padding:6px">该项目不存在或暂无产物</div>';renderDrawer();}
    else setStatus('加载失败：'+e.message);
    return null;}
  _res={batches:{},count:data.count};_mergeResult(data);
  setStatus('共 '+_res.count+' 个对象 · '+Object.keys(_res.batches).length+' 个批次');
  return _res;
}
// 渐进加载：先出骨架（批次+切片），再逐批次拉内容，每拉完一批就刷新显示
async function loadResultsProgressive(){
  _res=null;
  let list;
  try{list=await api('/result?include_content=false&project_id='+encodeURIComponent(proj()))}
  catch(e){
    if((''+e.message).includes('404')){setStatus('该项目不存在或暂无产物');_res=null;_drawerMode='all';renderDrawer();return;}
    setStatus('加载失败：'+e.message);return;}
  _res={batches:{},count:list.count};_mergeResult(list);
  _drawerMode='all';renderDrawer();               // 立即显示批次骨架+切片
  const bs=Object.keys(_res.batches).sort().reverse();  // 新批次先出
  let done=0;
  for(const b of bs){
    try{const bd=await api('/result?project_id='+encodeURIComponent(proj())+'&batch='+encodeURIComponent(b));
      _mergeResult(bd);}catch(e){}
    done++;setStatus('已加载 '+done+'/'+bs.length+' 批次…');renderDrawer();
  }

function reviseEditor(ptype,ctx,curSelling){
  const wrap=document.createElement('div');wrap.style.cssText='margin-top:8px;border-top:1px dashed var(--line);padding-top:8px';
  const toggle=document.createElement('button');toggle.className='mini';toggle.textContent='✎ 修改';

  const ta=document.createElement('textarea');ta.rows=2;ta.placeholder='例如：改成俯拍、加强微距特写、时长压到2秒…';
  ta.style.cssText='width:100%;margin:4px 0 8px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;resize:vertical;font-size:13px';
  body.appendChild(lab2);body.appendChild(ta);

  btn.onclick=()=>doRevise(ptype,ctx,sellingInput,ta,btn);

  body.appendChild(note);
  wrap.appendChild(toggle);wrap.appendChild(body);return wrap;
}
async function doRevise(ptype,ctx,sellingInput,ta,btn){
  if(!tok()){alert('先填访问口令');return}
  const instruction=(ta.value||'').trim();
  let selling=null;
  if(sellingInput){selling=sellingInput.value.split(/[，,、]/).map(s=>s.trim()).filter(Boolean);}
  if(!instruction&&(!selling||!selling.length)){alert('请填写新卖点或修改需求');return}
  btn.disabled=true;btn.textContent='提交中…';
  const body={project_id:proj(),batch:ctx.batch||'',ad:(ptype==='common'?'':(ctx.ad||'')),ptype:ptype,
    idx:(ctx.idx!=null?ctx.idx:null),selling:selling,instruction:instruction,
    product:$('#product').value.trim()||'',
    openrouter_key:$('#orkey').value.trim()||null,deepseek_key:$('#dskey').value.trim()||null,
    custom_prompts:(()=>{try{const o=JSON.parse(localStorage.getItem('customPrompts')||'{}');return Object.keys(o).length?o:null}catch(e){return null}})()};
  try{
    const r=await fetch('/prompt/revise',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    if(!d.started){alert('提交失败 '+(d.detail||r.status));btn.disabled=false;btn.textContent='应用修改';return}
    logOps('▶ 提示词修改任务 #'+d.job_id+' 处理中…');
    const job=await waitJob(d.job_id);
    logOps((job.ok?'✓':'✗')+' 提示词修改：'+(job.detail||''));
    if(job.ok){const m=_drawerMode;await ensureResult(true);_drawerMode=m;renderDrawer();}
    else alert('修改失败：'+(job.detail||''));
  }catch(e){alert('修改失败：'+e.message);}
  btn.disabled=false;btn.textContent='应用修改';
}

  const enId='enitem|'+o.project+'|'+o.batch+'|'+(o.ad||'common')+'|'+o.ptype+'|'+o.idx;
  _fillEnItem(enPane,enId,o.getEnItem);
  bz.onclick=e=>{e.stopPropagation();e.preventDefault();zhPane.style.display='';enPane.style.display='none';bz.className='on';be.className='';};
  be.onclick=e=>{e.stopPropagation();e.preventDefault();zhPane.style.display='none';enPane.style.display='';be.className='on';bz.className='';_fillEnItem(enPane,enId,o.getEnItem);};
  d.appendChild(zhPane);d.appendChild(enPane);
  return d;
}
function _enItemNode(e){const f=document.createDocumentFragment();if(e.卖点)f.appendChild(tags(e.卖点));f.appendChild(promptBlock(e.prompt||e.video_prompt_text||''));return f;}
function _fillEnItem(pane,enId,getEn){
  const e=getEn&&getEn();pane.innerHTML='';
  if(e&&(e.prompt||e.video_prompt_text)){pane.appendChild(_enItemNode(e));delete _enReg[enId];}
  else{const w=document.createElement('div');w.className='bi-en-wait';w.textContent='正在翻译中…';pane.appendChild(w);
    _enReg[enId]={get:()=>{const x=getEn&&getEn();return (x&&(x.prompt||x.video_prompt_text))?x:null;},render:_enItemNode,pane:pane};
    startEnPoll();}
}
// 分块构造器：中英复用同一套（英文 JSON 字段与中文一致）
function buildAggBox(agg){
  agg=agg||{};const f=document.createDocumentFragment();
  if(agg.广告主张){const p=document.createElement('div');p.style.margin='6px 0';p.innerHTML='<b>主张：</b>'+agg.广告主张;f.appendChild(p);}
  if(agg.商品卖点){const h=document.createElement('h3');h.textContent='卖点';f.appendChild(h);f.appendChild(tags(agg.商品卖点));}
  if(agg.解决痛点){const h=document.createElement('h3');h.textContent='痛点';f.appendChild(h);f.appendChild(tags(agg.解决痛点,'pain'));}
  return f;
}
function buildVpBox(vp,ctx){
  vp=vp||{};const det=document.createElement('details');det.open=true;
  const sm=document.createElement('summary');sm.textContent='视频级脚本 prompt';
  if(ctx){const ref='prompt|'+ctx.project+'|'+ctx.batch+'|'+ctx.ad+'|video|'+ctx.lang;
    const meta={project:ctx.project,batch:ctx.batch,ad:ctx.ad,ptype:'video',lang:ctx.lang,title:'视频级脚本 prompt',text:vp.video_prompt_text||''};
    sm.appendChild(favStar('prompt',ref,'视频级脚本 prompt',meta));}
  det.appendChild(sm);
  det.appendChild(promptBlock(vp.video_prompt_text||''));
  if(ctx&&ctx.lang==='zh')det.appendChild(reviseEditor('video',ctx,null));
  return det;
}
function buildSpBox(sp,ctx,videos){
  const list=((sp||{}).镜头级prompt列表)||[];const det=document.createElement('details');det.open=true;
  const sm=document.createElement('summary');sm.textContent='镜头 prompt 素材（'+list.length+' 条 · 逐镜头）';det.appendChild(sm);
  list.forEach((it,i)=>det.appendChild(promptItemFull({
    ptype:'shot',project:ctx.project,batch:ctx.batch,ad:ctx.ad,idx:i,zhItem:it,clipUrl:clipForShot(videos,it,i),
    getEnItem:()=>{const a=_adOf(ctx.batch,ctx.ad);const l=a&&a.sp_en&&a.sp_en.镜头级prompt列表;return l?l[i]:null;}})));
  return det;
}
function buildCommonBody(v,ctx){
  v=v||{};const f=document.createDocumentFragment();
  if(v.商品共性卖点)f.appendChild(tags(v.商品共性卖点));
  ((v.共性镜头prompt列表)||[]).forEach((it,i)=>f.appendChild(promptItemFull({
    ptype:'common',project:ctx.project,batch:ctx.batch,ad:'common',idx:i,zhItem:it,
    getEnItem:()=>{const b=_res&&_res.batches&&_res.batches[ctx.batch];const l=b&&b.common_en&&b.common_en.共性镜头prompt列表;return l?l[i]:null;}})));
  return f;
}

function renderAdDetail(batch,ad,d,videos){
  const frag=document.createDocumentFragment();const agg=d.agg||{},vp=d.vp||{},sp=d.sp||{};
  if(d.source){const p=document.createElement('div');p.style.margin='4px 0';p.innerHTML='<b>原视频：</b><a href="'+d.source+'" target="_blank" rel="noopener" style="color:var(--accent);word-break:break-all">'+d.source+'</a>';frag.appendChild(p)}
  if(!agg.广告主张&&!vp.video_prompt_text){const p=document.createElement('div');p.className='muted';p.style.marginTop='6px';p.textContent='（仅拆分，尚未分析——点「开始分析本项目」生成卖点/脚本）';frag.appendChild(p)}
  if(videos.length){
    const det=document.createElement('details');det.open=true;
    const sm=document.createElement('summary');sm.textContent='镜头切片（'+videos.length+'）';det.appendChild(sm);
    const w=document.createElement('div');w.className='shots';w.style.marginTop='6px';
    videos.forEach(u=>{
      const cell=document.createElement('div');cell.className='clipcell';
      const v=document.createElement('video');v.src=u;v.preload='metadata';cell.appendChild(v);
      const barc=document.createElement('div');barc.className='clipbar';
      const pb=document.createElement('button');pb.textContent='▶ 播放';pb.onclick=()=>openClip(u);
      const db=document.createElement('button');db.textContent='⬇ 下载';db.onclick=()=>downloadClip(u);
      barc.appendChild(pb);barc.appendChild(db);cell.appendChild(barc);
      w.appendChild(cell);});
    det.appendChild(w);frag.appendChild(det);
  }
  const vpctx={project:proj(),batch:batch,ad:ad,lang:'zh'};
  if(agg.广告主张||agg.商品卖点||agg.解决痛点){
    frag.appendChild(biBlock(buildAggBox(agg),'en|'+batch+'|'+ad+'|agg',
      ()=>{const a=_adOf(batch,ad);return hasContent(a&&a.agg_en)?a.agg_en:null;},buildAggBox));
  }
  if(vp.video_prompt_text){
    frag.appendChild(biBlock(buildVpBox(vp,vpctx),'en|'+batch+'|'+ad+'|vp',
      ()=>{const a=_adOf(batch,ad);return (a&&a.vp_en&&a.vp_en.video_prompt_text)?a.vp_en:null;},d=>buildVpBox(d,{...vpctx,lang:'en'})));
  }
  if(((sp.镜头级prompt列表)||[]).length){
    frag.appendChild(buildSpBox(sp,{project:proj(),batch:batch,ad:ad},videos));   // 每条镜头prompt自带中/EN与收藏
  }
  return frag;
}

function renderCommon(v,batch){
  const c=document.createElement('div');c.className='card';
  const list=v.共性镜头prompt列表||[];
  c.style.position='relative';
  c.innerHTML='<h2>品类共性镜头库 · '+(v.品类||'')+' <span class="muted" style="font-weight:400">（'+list.length+' 条 · 本批次归纳）</span></h2>';
  const dc=document.createElement('button');dc.className='mini';dc.textContent='⬇ 下载共性(json)';
  dc.style.cssText='position:absolute;top:16px;right:16px';dc.onclick=()=>downloadObj(v,(batch?batch+'_':'')+'共性镜头prompt.json');c.appendChild(dc);
  c.appendChild(buildCommonBody(v,{project:proj(),batch:batch,ad:'common'}));   // 每条共性prompt自带中/EN与收藏
  return c;
}

// 初始化：放在所有声明之后，避免 TDZ（wireDrawer 内含 measureHdr）
wireDrawer();_drawerMode='all';renderDrawer();openDrawer();
</script>
