<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>视频广告分析</title>
<style>
  :root{
    --bg:#eef2f8; --panel:#ffffff; --panel-2:#f7f9fc;
    --ink:#1b2431; --ink-2:#57617340; --sub:#5a6678; --muted:#9aa6b6;
    --line:#e7ecf3; --line-2:#dde4ee;
    --accent:#2f6bed; --accent-ink:#1e51c4; --accent-weak:#eaf1fe;
    --ok:#15a34a; --ok-bg:#e9f7ee; --warn:#c26a12; --warn-bg:#fbf1e2;
    --run:#5a52d8; --run-bg:#eeecfb; --pain:#c0561f; --pain-bg:#fbeee4;
    --r:14px; --r-sm:9px;
    --sh:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.05);
    --sh-sm:0 1px 2px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,#eef2f8,#e9eef6);color:var(--ink);
       font-family:-apple-system,"Segoe UI",system-ui,"Microsoft YaHei",sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}

  header{padding:14px 28px;background:rgba(255,255,255,.85);backdrop-filter:blur(10px);
         border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;
         position:sticky;top:0;z-index:10;box-shadow:0 1px 0 rgba(16,24,40,.02)}
  header h1{font-size:16px;margin:0 14px 0 0;font-weight:700;letter-spacing:.2px;
            background:linear-gradient(90deg,#2f6bed,#5a52d8);-webkit-background-clip:text;background-clip:text;color:transparent}
  header .muted{font-size:12px;color:var(--sub)}

  input,select{background:#fff;border:1px solid var(--line-2);color:var(--ink);
    padding:8px 11px;border-radius:var(--r-sm);font-size:13px;outline:none;transition:.15s}
  input::placeholder{color:var(--muted)}
  input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}

  button{background:var(--accent);border:0;color:#fff;padding:8px 16px;border-radius:var(--r-sm);
    cursor:pointer;font-size:13px;font-weight:600;transition:.15s;box-shadow:var(--sh-sm)}
  button:hover{background:var(--accent-ink)}
  button:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
  button.ghost{background:#fff;border:1px solid var(--line-2);color:var(--sub);font-weight:500;box-shadow:none}
  button.ghost:hover{background:var(--panel-2);border-color:var(--accent);color:var(--accent)}
  button.eye{background:#fff;border:1px solid var(--line-2);color:var(--sub);padding:6px 9px;font-size:13px;box-shadow:none}
  button.eye:hover{background:var(--panel-2)}
  button.mini{padding:3px 10px;font-size:11.5px;background:var(--panel-2);color:var(--sub);
    border:1px solid var(--line-2);margin-right:5px;font-weight:500;box-shadow:none}
  button.mini:hover{background:var(--accent-weak);border-color:var(--accent);color:var(--accent)}
  button.mini.del{background:#fff;border-color:#f0c9bb;color:var(--pain)}
  button.mini.del:hover{background:var(--pain-bg)}

  main{padding:24px 28px 60px;max-width:1120px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:20px 22px;margin-bottom:18px;box-shadow:var(--sh)}
  .card h2{font-size:15px;margin:0 0 14px;font-weight:700;display:flex;align-items:center;gap:9px}
  .card h2::before{content:"";width:4px;height:15px;border-radius:3px;
    background:linear-gradient(180deg,#2f6bed,#5a52d8);display:inline-block}
  .card h3{font-size:12px;color:var(--sub);margin:16px 0 7px;font-weight:600;letter-spacing:.3px;text-transform:none}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
  .row>b{color:var(--ink);font-weight:600}
  label.ck{color:var(--sub);display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}
  label.ck input{accent-color:var(--accent)}

  .tags{display:flex;flex-wrap:wrap;gap:7px}
  .tag{background:var(--accent-weak);border:1px solid #d7e4fd;color:var(--accent-ink);
    border-radius:20px;padding:4px 12px;font-size:12px;font-weight:500}
  .tag.pain{background:var(--pain-bg);border-color:#f2d3c3;color:var(--pain)}

  .shots{display:flex;flex-wrap:wrap;gap:12px}
  .shots video{width:172px;border-radius:10px;background:#000;border:1px solid var(--line-2);box-shadow:var(--sh-sm)}

  .prompt{position:relative;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
    padding:12px 12px;margin:7px 0;white-space:pre-wrap;font-size:12.5px;line-height:1.6;color:#2c3644}
  .copy{position:absolute;top:7px;right:7px;padding:3px 9px;font-size:11px;background:#fff;
    border:1px solid var(--line-2);color:var(--sub);box-shadow:none}
  .copy:hover{background:var(--accent-weak);color:var(--accent)}
  .muted{color:var(--muted)}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
  thead th,tr:first-child th{color:var(--sub);font-weight:600;background:var(--panel-2);
    border-bottom:1px solid var(--line-2)}
  tbody tr:hover,table tr:hover{background:var(--panel-2)}
  td.ops{white-space:nowrap}

  .badge{padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600}
  .badge.done{background:var(--ok-bg);color:var(--ok)}
  .badge.error{background:var(--pain-bg);color:var(--pain)}
  .badge.run{background:var(--run-bg);color:var(--run)}

  #ops .log,#opslog{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;margin-top:10px;font-size:12px;max-height:170px;overflow:auto;
    white-space:pre-wrap;color:#3a4557;font-family:"SFMono-Regular",Consolas,monospace}

  details{margin-top:8px}
  summary{cursor:pointer;color:var(--accent);font-weight:500}
  summary:hover{color:var(--accent-ink)}
</style>
</head>
<body>
<header>
  <h1>视频广告分析</h1>
  <span class="muted">OpenRouter Key</span>
  <input id="orkey" placeholder="留空=用服务端密钥" type="password" size="16"
         title="留空即可：默认使用服务端(Railway 变量)里配置的 OpenRouter 密钥。只有想临时换一把 key 时才填，填了只保存在你本地浏览器，不会上传保存">
  <button class="eye" onclick="toggleEye('orkey',this)" title="显示/隐藏">👁</button>
  <span class="muted">项目名</span>
  <input id="project" placeholder="如 test" size="10"
         title="一批广告用同一个项目名。R2 里按 projects/{项目名}/{广告}/ 存放，分析和横向对比也按项目为单位">
  <span class="muted">访问口令</span>
  <input id="token" placeholder="APP_TOKEN" type="password" size="10"
         title="服务端设置的 APP_TOKEN，用于调用接口鉴权。填一次会记住">
  <button class="eye" onclick="toggleEye('token',this)" title="显示/隐藏">👁</button>
  <button onclick="loadAll()">加载结果</button>
  <span id="status" class="muted"></span>
</header>
<main>
  <div class="card" id="ops">
    <h2>操作</h2>
    <div class="row">
      <b>① 上传拆分：</b>
      <input type="file" id="files" accept="video/*" multiple>
      <button id="btnSplit" onclick="doSplit()">上传并拆分</button>
      <span class="muted">引擎</span>
      <select id="engine">
        <option value="gpu">GPU (Modal·快)</option>
        <option value="cpu">CPU (Railway·慢)</option>
      </select>
      <label class="ck"><input type="checkbox" id="fast"> 快速切分(不重编码·可能重复/不准)</label>
      <label class="ck"><input type="checkbox" id="keepraw"> 保留原视频</label>
      <span class="muted">文件名会作为广告 id</span>
    </div>
    <div class="row">
      <b>② 分析：</b>
      <button id="btnAnalyze" onclick="doAnalyze()">开始分析本项目</button>
      <label class="ck"><input type="checkbox" id="cc"> 生成横向对比</label>
      <label class="ck"><input type="checkbox" id="pro"> 用更强模型(Pro,贵)</label>
      <label class="ck"><input type="checkbox" id="ow"> 强制重跑</label>
    </div>
    <div class="row">
      <span class="muted">产品名</span>
      <input id="product" placeholder="如 钻石画" size="14"
             title="这批广告卖的产品，作为提示传给分析模型（只影响分析，不影响拆分）">
      <span class="muted">前置卖点（可选）</span>
      <input id="hyp" placeholder="如：免养护,开箱即用,送礼首选" size="32"
             title="已知的卖点，逗号分隔。供分析模型参考验证，可留空">
    </div>
    <div class="log" id="opslog"></div>
  </div>

  <div class="card">
    <h2>存储管理 <span class="muted" style="font-weight:400;font-size:12px">· 删除后不可恢复</span></h2>
    <div class="row">
      <button class="ghost" onclick="doDelete(false,true)">仅删分析产物（保留切片）</button>
      <button class="ghost" onclick="doDelete(false,false)">删除整个项目（含切片）</button>
      <button class="ghost" onclick="clearJobs()">清空本项目任务记录</button>
    </div>
    <div class="row">
      <span class="muted">删除单条广告：</span>
      <input id="delAd" placeholder="广告 id，如 海马" size="14">
      <button class="ghost" onclick="doDelete(true,false)">删除该广告</button>
    </div>
  </div>

  <div class="card">
    <h2>任务记录 <button class="ghost" style="float:right;padding:3px 10px" onclick="loadJobs()">刷新</button></h2>
    <div id="jobs" class="muted">加载后显示</div>
  </div>
  <div id="results"></div>
</main>

<script>
const $=s=>document.querySelector(s);
const proj=()=>$('#project').value.trim();
function toggleEye(id,btn){const el=$('#'+id);const show=el.type==='password';el.type=show?'text':'password';btn.textContent=show?'🙈':'👁'}
const tok=()=>$('#token').value.trim();
const headers=()=>tok()?{'X-API-Token':tok()}:{};
const setStatus=t=>$('#status').textContent=t||'';
$('#token').value=localStorage.getItem('tok')||'';
$('#project').value=localStorage.getItem('proj')||'test';
$('#product').value=localStorage.getItem('prod')||'';
$('#hyp').value=localStorage.getItem('hyp')||'';
$('#engine').value=localStorage.getItem('eng')||'gpu';
$('#orkey').value=localStorage.getItem('ork')||'';
function remember(){localStorage.setItem('tok',tok());localStorage.setItem('proj',proj());localStorage.setItem('prod',$('#product').value.trim());localStorage.setItem('hyp',$('#hyp').value.trim());localStorage.setItem('eng',$('#engine').value);localStorage.setItem('ork',$('#orkey').value.trim())}

function setOps(t){$('#status').textContent=t||''}
function logOps(t){const l=$('#opslog');l.textContent+=t+'\n';l.scrollTop=l.scrollHeight}

async function api(path){const r=await fetch(path,{headers:headers()});if(!r.ok)throw new Error(path+' -> '+r.status);return r.json()}

// 轮询 /jobs 直到指定任务完成，返回该任务
async function waitJob(jid,onTick){
  while(true){
    await new Promise(r=>setTimeout(r,4000));
    try{
      const jd=await api('/jobs?limit=40');
      loadJobs();
      const job=(jd.jobs||[]).find(j=>j.id===jid);
      if(job && job.status!=='running') return job;
      if(onTick)onTick();
    }catch(e){}
  }
}

// ===== 操作 =====
async function doSplit(){
  remember();const files=$('#files').files;
  if(!files.length){alert('先选视频文件');return}
  if(!tok()){alert('先填访问口令');return}
  $('#btnSplit').disabled=true;
  for(let i=0;i<files.length;i++){
    const f=files[i];
    setStatus(`拆分 ${i+1}/${files.length}: ${f.name}（后台运行）…`);
    logOps('▶ 提交拆分 '+f.name+'（'+$('#engine').value.toUpperCase()+'）…');
    const fd=new FormData();fd.append('project_id',proj());
    fd.append('ad_id',f.name.replace(/\.[^.]+$/,''));fd.append('precise',$('#fast').checked?'false':'true');fd.append('engine',$('#engine').value);fd.append('keep_raw',$('#keepraw').checked?'true':'false');fd.append('file',f);
    try{
      const r=await fetch('/split',{method:'POST',headers:headers(),body:fd});
      const d=await r.json();
      if(!d.started){logOps('✗ 提交失败 '+f.name+' '+(d.error||r.status));continue}
      const job=await waitJob(d.job_id);
      logOps((job.ok?'✓':'✗')+' 拆分 '+f.name+(job.ok?`  ${(job.detail||'').replace(' shots','')} 个镜头`:'  失败: '+(job.detail||'')));
    }catch(e){logOps('✗ 拆分 '+f.name+'  '+e.message)}
  }
  setStatus('拆分完成');$('#btnSplit').disabled=false;loadJobs();
}

async function doAnalyze(){
  remember();if(!tok()){alert('先填访问口令');return}
  $('#btnAnalyze').disabled=true;
  const body={project_id:proj(),product:$('#product').value.trim()||'产品',
    cross_compare:$('#cc').checked,pro:$('#pro').checked,overwrite:$('#ow').checked,
    hypotheses:$('#hyp').value.trim()||null,
    openrouter_key:$('#orkey').value.trim()||null};
  setStatus('提交分析…');logOps('▶ 提交分析项目 '+proj()+' …');
  let jid=null;
  try{
    const r=await fetch('/analyze',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    if(!d.started){logOps('✗ 启动失败');setStatus('启动失败');$('#btnAnalyze').disabled=false;return}
    jid=d.job_id;
    logOps('▶ 已在后台开始（任务#'+jid+'），分析中…可以离开，稍后回来看');
  }catch(e){logOps('✗ 提交失败 '+e.message);setStatus('提交失败');$('#btnAnalyze').disabled=false;return}

  setStatus('分析中…（后台运行，自动刷新）');
  const timer=setInterval(async()=>{
    try{
      const jd=await api('/jobs?limit=30');
      const job=(jd.jobs||[]).find(j=>j.id===jid);
      if(job && job.status!=='running'){
        clearInterval(timer);$('#btnAnalyze').disabled=false;
        logOps(job.ok?('✓ 分析完成（#'+jid+'，'+job.duration_sec+'s）'):('✗ 分析失败（#'+jid+'）'));
        setStatus(job.ok?'分析完成':'分析失败');
        if(job.ok)loadAll();else loadJobs();
      }else{loadJobs()}
    }catch(e){}
  },5000);
}

// ===== 查看 =====
function copyBtn(t){const b=document.createElement('button');b.className='copy';b.textContent='复制';b.onclick=()=>{navigator.clipboard.writeText(t);b.textContent='已复制';setTimeout(()=>b.textContent='复制',1200)};return b}
function promptBlock(t){const d=document.createElement('div');d.className='prompt';d.textContent=t;d.appendChild(copyBtn(t));return d}
function tags(a,cls){const w=document.createElement('div');w.className='tags';(a||[]).forEach(t=>{const s=document.createElement('span');s.className='tag'+(cls?' '+cls:'');s.textContent=t;w.appendChild(s)});return w}

async function viewJob(kind,ref,detail,status){
  if(status==='error'&&detail){logOps('✗ 任务失败原因：'+detail)}
  await loadAll();
  if(ref){
    const el=document.getElementById('ad-'+ref);
    if(el){el.scrollIntoView({behavior:'smooth',block:'start'});el.style.outline='2px solid var(--acc)';
      setTimeout(()=>el.style.outline='',2000);}
    else logOps('（结果里没有「'+ref+'」这条广告，可能已删除或尚未分析）');
  }
}

async function delJob(id,kind,ref){
  if(!tok()){alert('先填访问口令');return}
  let msg,delReq=null;
  if(kind==='split'&&ref){
    msg='删除任务 #'+id+'（拆分 '+ref+'）\n\n将一并删除广告「'+ref+'」在 R2 的全部文件：\n· 镜头切片\n· 该广告的分析产物\n\n不可恢复，确定？';
    delReq={project_id:proj(),ad_id:ref,analysis_only:false,clear_jobs:false};
  }else if(kind==='analyze'){
    msg='删除任务 #'+id+'（分析 '+ref+'）\n\n分析是整个项目级的，将删除项目「'+proj()+'」在 R2 的全部文件：\n· 所有广告的镜头切片\n· 所有分析产物 / 共性 prompt / 横向对比\n\n不可恢复，确定？';
    delReq={project_id:proj(),ad_id:null,analysis_only:false,clear_jobs:false};
  }else{
    msg='删除任务记录 #'+id+'？';
  }
  if(!confirm(msg))return;

  if(delReq){
    try{
      const r=await fetch('/delete',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},
        body:JSON.stringify(delReq)});
      const d=await r.json();
      logOps(d.ok?('✓ 已删除 R2 文件 '+d.deleted+' 个（'+d.scope+'）'):('✗ 删文件失败 '+(d.detail||r.status)));
    }catch(e){logOps('✗ 删文件失败 '+e.message)}
  }
  try{
    await fetch('/jobs/delete',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},
      body:JSON.stringify({job_id:id})});
    logOps('✓ 已删除任务记录 #'+id);
  }catch(e){logOps('✗ 删记录失败 '+e.message)}
  loadJobs();loadAll();
}

async function doDelete(single,analysisOnly){
  remember();if(!tok()){alert('先填访问口令');return}
  const ad=single?$('#delAd').value.trim():'';
  if(single&&!ad){alert('先填要删除的广告 id');return}
  const what=analysisOnly?'分析产物':(single?('广告 '+ad+' 的全部文件'):('整个项目 '+proj()+' 的全部文件'));
  if(!confirm('确定删除 '+what+' ？此操作不可恢复。'))return;
  try{
    const r=await fetch('/delete',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},
      body:JSON.stringify({project_id:proj(),ad_id:ad||null,analysis_only:analysisOnly,clear_jobs:false})});
    const d=await r.json();
    logOps(d.ok?('✓ 已删除 '+d.deleted+' 个对象（'+d.scope+'）'):('✗ 删除失败 '+(d.detail||r.status)));
    loadAll();
  }catch(e){logOps('✗ 删除失败 '+e.message)}
}
async function clearJobs(){
  if(!confirm('清空项目 '+proj()+' 的任务记录？'))return;
  try{
    const r=await fetch('/delete',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},
      body:JSON.stringify({project_id:proj(),analysis_only:true,ad_id:'__none__',clear_jobs:true})});
    const d=await r.json();logOps('✓ 已清理任务记录 '+d.jobs_deleted+' 条');loadJobs();
  }catch(e){logOps('✗ 清理失败 '+e.message)}
}

function fmtCost(j){
  const c=Number(j.cost_usd||0);
  if(!c)return j.kind==='split'&&j.engine==='cpu'?'含订阅':'-';
  const cny=(c*7.2).toFixed(3);
  return (j.cost_exact===false?'≈':'')+'$'+c.toFixed(4)+' (¥'+cny+')';
}

async function loadJobs(){
  try{const d=await api('/jobs?limit=30');
    if(!d.db_enabled){$('#jobs').innerHTML='<span class="muted">数据库未启用</span>';return}
    if(!d.jobs.length){$('#jobs').innerHTML='<span class="muted">暂无记录</span>';return}
    let h='<table><tr><th>ID</th><th>类型</th><th>项目</th><th>对象</th><th>产品名</th><th>引擎</th><th>状态</th><th>耗时(s)</th><th>费用</th><th>时间</th><th>操作</th></tr>';
    d.jobs.forEach(j=>{const cls=j.status==='done'?'done':(j.status==='error'?'error':'run');h+=`<tr><td>${j.id}</td><td>${j.kind}</td><td>${j.project_id}</td><td>${j.ref||''}</td><td class="muted">${j.product||''}</td><td class="muted">${j.engine||''}</td><td><span class="badge ${cls}" title="${(j.detail||'').replace(/"/g,"'")}">${j.status}</span></td><td>${j.duration_sec||''}</td><td class="muted">${fmtCost(j)}</td><td class="muted">${(j.created_at||'').slice(0,19)}</td><td class="ops"><button class="mini" onclick="viewJob('${(j.kind||'')}','${(j.ref||'').replace(/'/g,"\\'")}','${(j.detail||'').replace(/'/g,"").replace(/"/g,"")}','${j.status}')">查看</button><button class="mini del" onclick="delJob(${j.id},'${(j.kind||'')}','${(j.ref||'').replace(/'/g,"\\'")}')">删除</button></td></tr>`});
    const total=d.jobs.reduce((a,j)=>a+Number(j.cost_usd||0),0);
    const nAn=d.jobs.filter(j=>j.kind==='analyze').length, nSp=d.jobs.filter(j=>j.kind==='split').length;
    $('#jobs').innerHTML=h+'</table>'
      +`<div style="margin-top:10px;color:var(--sub);font-size:12.5px">
         本页 ${d.jobs.length} 条任务（分析 ${nAn} · 拆分 ${nSp}）累计花费：
         <b style="color:var(--txt)">$${total.toFixed(4)} ≈ ¥${(total*7.2).toFixed(2)}</b>
         <span style="margin-left:8px">分析费用为 OpenRouter 实际扣费；GPU 拆分为按耗时估算（带 ≈）</span>
       </div>`;
  }catch(e){$('#jobs').innerHTML='<span class="muted">加载失败：'+e.message+'</span>'}
}

function adFromKey(k,pid){const rest=k.replace('projects/'+pid+'/','');const p=rest.split('/');return p.length>=2?p[0]:null}

async function loadAll(){
  remember();setStatus('加载中…');$('#results').innerHTML='';await loadJobs();
  let data;try{data=await api('/result?project_id='+encodeURIComponent(proj()))}catch(e){setStatus('加载失败：'+e.message);return}
  setStatus('共 '+data.count+' 个对象');
  const pid=proj();const ads={};let common=null;
  for(const [k,v] of Object.entries(data.reports||{})){
    if(k.endsWith('共性镜头prompt.json')){common=v;continue}
    const ad=adFromKey(k,pid);if(!ad)continue;ads[ad]=ads[ad]||{};
    if(k.endsWith('ad_aggregate.json'))ads[ad].agg=v;
    else if(k.endsWith('video_prompt.json'))ads[ad].vp=v;
    else if(k.endsWith('shot_prompts.json'))ads[ad].sp=v;
  }
  const vids={};(data.objects||[]).forEach(o=>{if(o.key.endsWith('.mp4')){const ad=adFromKey(o.key,pid);if(ad)(vids[ad]=vids[ad]||[]).push(o.url)}});
  // 只拆分、还没分析的广告也要出卡片（至少能看切片），否则「查看」定位不到
  Object.keys(vids).forEach(ad=>{ if(!ads[ad]) ads[ad]={}; });
  const root=$('#results');
  for(const [ad,d] of Object.entries(ads))root.appendChild(renderAd(ad,d,(vids[ad]||[]).sort()));
  if(common)root.appendChild(renderCommon(common));
}

function renderAd(ad,d,videos){
  const c=document.createElement('div');c.className='card';c.id='ad-'+ad;const agg=d.agg||{},vp=d.vp||{},sp=d.sp||{};
  c.innerHTML=`<h2>广告：${ad} <span class="muted" style="font-weight:400">· ${agg.total_duration||'?'}s · ${(vp.广告结构分类&&vp.广告结构分类.主结构)||''}</span></h2>`;
  if(!agg.广告主张&&!vp.video_prompt_text){const p=document.createElement('div');p.className='muted';p.textContent='（仅拆分，尚未分析——点「开始分析本项目」生成卖点/脚本）';c.appendChild(p)}
  if(agg.广告主张){const p=document.createElement('div');p.innerHTML='<b>主张：</b>'+agg.广告主张;c.appendChild(p)}
  if(videos.length){const h=document.createElement('h3');h.textContent='镜头切片';c.appendChild(h);const w=document.createElement('div');w.className='shots';videos.forEach(u=>{const v=document.createElement('video');v.src=u;v.controls=true;w.appendChild(v)});c.appendChild(w)}
  if(agg.商品卖点){const h=document.createElement('h3');h.textContent='卖点';c.appendChild(h);c.appendChild(tags(agg.商品卖点))}
  if(agg.解决痛点){const h=document.createElement('h3');h.textContent='痛点';c.appendChild(h);c.appendChild(tags(agg.解决痛点,'pain'))}
  if(vp.video_prompt_text){const h=document.createElement('h3');h.textContent='视频级脚本 prompt';c.appendChild(h);c.appendChild(promptBlock(vp.video_prompt_text))}
  const list=(sp.镜头级prompt列表||[]);
  if(list.length){const h=document.createElement('h3');h.textContent='镜头 prompt 素材（'+list.length+' 条）';c.appendChild(h);const det=document.createElement('details');det.innerHTML='<summary>展开查看</summary>';list.forEach(it=>{const t=document.createElement('div');t.style.marginTop='8px';t.innerHTML='<b>'+(it.标题||it.id||'')+'</b>';det.appendChild(t);det.appendChild(tags(it.卖点));det.appendChild(promptBlock(it.prompt||''))});c.appendChild(det)}
  return c;
}
function renderCommon(v){
  const c=document.createElement('div');c.className='card';
  c.innerHTML=`<h2>品类共性镜头库 · ${v.品类||''} <span class="muted" style="font-weight:400">（${(v.共性镜头prompt列表||[]).length} 条）</span></h2>`;
  if(v.商品共性卖点)c.appendChild(tags(v.商品共性卖点));
  (v.共性镜头prompt列表||[]).forEach(it=>{const t=document.createElement('div');t.style.marginTop='10px';t.innerHTML='<b>'+(it.标题||it.id||'')+'</b>';c.appendChild(t);c.appendChild(tags(it.卖点));c.appendChild(promptBlock(it.prompt||''))});
  return c;
}
</script>
