<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>视频广告分析</title>
<style>
  :root{
    --bg:#eef2f8; --panel:#ffffff; --panel-2:#f7f9fc;
    --ink:#1b2431; --ink-2:#57617340; --sub:#5a6678; --muted:#9aa6b6;
    --line:#e7ecf3; --line-2:#dde4ee;
    --accent:#2f6bed; --accent-ink:#1e51c4; --accent-weak:#eaf1fe;
    --ok:#15a34a; --ok-bg:#e9f7ee; --warn:#c26a12; --warn-bg:#fbf1e2;
    --run:#5a52d8; --run-bg:#eeecfb; --pain:#c0561f; --pain-bg:#fbeee4;
    --r:14px; --r-sm:9px;
    --sh:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.05);
    --sh-sm:0 1px 2px rgba(16,24,40,.05);
  }
:root{--drawer-w:50vw}
  *{box-sizing:border-box}
  body{margin:0;background:#edf1f7;color:var(--ink);
       font-family:-apple-system,"Segoe UI",system-ui,"Microsoft YaHei",sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
  #scroll{background:#edf1f7}

  header{padding:14px 28px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
         border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;
         position:fixed;top:0;left:0;right:0;z-index:40;box-shadow:0 1px 0 rgba(16,24,40,.02)}
  header h1{font-size:16px;margin:0 14px 0 0;font-weight:700;letter-spacing:.2px;
            background:linear-gradient(90deg,#2f6bed,#5a52d8);-webkit-background-clip:text;background-clip:text;color:transparent}
  header .muted{font-size:12px;color:var(--sub)}

  input,select{background:#fff;border:1px solid var(--line-2);color:var(--ink);
    padding:8px 11px;border-radius:var(--r-sm);font-size:13px;outline:none;transition:.15s}
  input::placeholder{color:var(--muted)}
  input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}

  button{background:#fff;border:1px solid var(--line-2);color:var(--sub);padding:8px 16px;border-radius:var(--r-sm);
    cursor:pointer;font-size:13px;font-weight:600;transition:.15s;box-shadow:var(--sh-sm)}
  button:hover{background:var(--accent-weak);color:var(--accent);border-color:var(--accent)}
  button:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
  .iconbtn{background:transparent;border:0;box-shadow:none;color:var(--sub);padding:5px 7px;font-size:15px;
    line-height:1;border-radius:7px;font-weight:400}
  .iconbtn:hover{background:var(--accent-weak);color:var(--accent)}
  .iconbtn.on{background:var(--accent-weak);color:var(--accent)}
  button.ghost{background:#fff;border:1px solid var(--line-2);color:var(--sub);font-weight:500;box-shadow:none}
  button.ghost:hover{background:var(--accent-weak);border-color:var(--accent);color:var(--accent)}
  button.eye{background:#fff;border:1px solid var(--line-2);color:var(--sub);padding:6px 9px;font-size:13px;box-shadow:none}
  button.eye:hover{background:var(--accent-weak);color:var(--accent);border-color:var(--accent)}
  button.mini{padding:3px 10px;font-size:11.5px;background:var(--panel-2);color:var(--sub);
    border:1px solid var(--line-2);margin-right:5px;font-weight:500;box-shadow:none}
  button.mini:hover{background:var(--accent-weak);border-color:var(--accent);color:var(--accent)}
  button.mini.del{background:#fff;border-color:#f0c9bb;color:var(--pain)}
  button.mini.del:hover{background:var(--pain-bg)}

  main{padding:24px 28px 60px;max-width:1120px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
    padding:20px 22px;margin-bottom:18px;box-shadow:var(--sh)}
  .card h2{font-size:15px;margin:0 0 14px;font-weight:700;display:flex;align-items:center;gap:9px}
  .card h2::before{content:"";width:4px;height:15px;border-radius:3px;
    background:linear-gradient(180deg,#2f6bed,#5a52d8);display:inline-block}
  .card h3{font-size:12px;color:var(--sub);margin:16px 0 7px;font-weight:600;letter-spacing:.3px;text-transform:none}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
  .row>b{color:var(--ink);font-weight:600}
  label.ck{color:var(--sub);display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer}
  label.ck input{accent-color:var(--accent)}

  .tags{display:flex;flex-wrap:wrap;gap:7px}
  .tag{background:var(--accent-weak);border:1px solid #d7e4fd;color:var(--accent-ink);
    border-radius:20px;padding:4px 12px;font-size:12px;font-weight:500}
  .tag.pain{background:var(--pain-bg);border-color:#f2d3c3;color:var(--pain)}

  .shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
  #drawer .shots{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
  .shots video{width:100%;height:auto;border-radius:8px;background:#000;border:1px solid var(--line-2);box-shadow:var(--sh-sm)}

  .prompt{position:relative;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
    padding:12px 12px;margin:7px 0;white-space:pre-wrap;font-size:12.5px;line-height:1.6;color:#2c3644}
  .copy{position:absolute;top:6px;right:6px;padding:3px 5px;background:#fff;line-height:0;
    border:1px solid var(--line-2);color:var(--sub);box-shadow:none;opacity:0;transition:opacity .15s}
  .prompt:hover .copy{opacity:1}
  .copy:hover{background:var(--accent-weak);color:var(--accent)}
  .copy.done-ic,.dlbtn.done-ic{color:var(--ok);border-color:#bfe6ca;background:var(--ok-bg);opacity:1}
  /* 下载图标：默认隐藏，悬停所在卡片/区域才出现 */
  .dlbtn{opacity:0;transition:opacity .15s;line-height:0}
  .card:hover .dlbtn,.adcell:hover .dlbtn{opacity:1}
  .muted{color:var(--muted)}

  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
  thead th,tr:first-child th{color:var(--sub);font-weight:600;background:var(--panel-2);
    border-bottom:1px solid var(--line-2)}
  tbody tr:hover,table tr:hover{background:var(--panel-2)}
  td.ops{white-space:nowrap}
  /* 任务记录：不随右边栏挤压而缩排，保持最小宽度、剩余区域横向滚动看全 */
  #jobs{overflow-x:auto}
  #jobs table{min-width:1040px}
  #jobs th{white-space:nowrap}
  .objw{display:inline-block;max-width:168px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
  .objw .obj{white-space:nowrap;transition:transform .3s}

  .badge{padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600}
  .badge.done{background:var(--ok-bg);color:var(--ok)}
  .badge.error{background:var(--pain-bg);color:var(--pain)}
  .badge.run{background:var(--run-bg);color:var(--run)}

  #ops .log,#opslog{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;
    padding:10px 12px;margin-top:10px;font-size:12px;max-height:170px;overflow:auto;
    white-space:pre-wrap;color:#3a4557;font-family:"SFMono-Regular",Consolas,monospace}

  details{margin-top:8px}
  details>summary{cursor:pointer;color:var(--sub);font-weight:600;font-size:12.5px;
    list-style:none;user-select:none;padding:3px 0}
  details>summary::-webkit-details-marker{display:none}
  details>summary::before{content:"▸";color:var(--accent);margin-right:7px;font-size:11px}
  details[open]>summary::before{content:"▾"}
  details>summary:hover{color:var(--accent)}
  summary.ad-sum{font-size:14px;color:var(--ink);padding:2px 0 8px}
  details.pi{margin-left:18px;padding-left:12px;border-left:2px solid var(--line-2);margin-top:6px}
  details.pi>summary{color:var(--ink)}
  .bi-tabs{display:inline-flex;gap:1px;background:var(--line-2);border-radius:6px;padding:1px;vertical-align:middle}
  .bi-tabs button{border:0;background:transparent;color:var(--muted);font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:5px;cursor:pointer;line-height:1.5}
  .bi-tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.12)}
  .bi-en-wait{color:var(--muted);padding:8px 2px;font-size:13px}
  .bi-en-wait::before{content:"⏳ "}
  .fav-star{border:0;background:transparent;cursor:pointer;color:#c9ccd4;font-size:15px;line-height:1;padding:2px 4px;vertical-align:middle}
  .fav-star:hover{color:#f4b400}
  .fav-star.on{color:#f4b400}
  .fav-clip{position:absolute;top:4px;right:4px;z-index:2;background:rgba(255,255,255,.85);border-radius:6px}
  .fav-row{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;position:relative}
  .fav-row .rm{position:absolute;top:8px;right:10px}
  .fav-kind-h{font-size:12px;color:var(--sub);font-weight:600;margin:14px 0 6px}
  /* 结果栏（Claude 风格并列侧栏）——默认打开、1/4 宽、位于顶栏之下、比顶栏略矮 */
  #drawer{position:fixed;top:calc(var(--hdr-h,56px) + 6px);right:8px;bottom:10px;
    width:var(--drawer-w);z-index:30;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;box-shadow:-8px 12px 36px rgba(16,24,40,.14);overflow:hidden;
    display:flex;flex-direction:column;
    transform:translateX(calc(100% + 20px));transition:transform .26s ease,width .18s ease}
  body.drawer-open #drawer{transform:translateX(0)}
  body.drawer-full #drawer{right:8px;left:8px;width:auto}
  #drawerToolbar{display:flex;align-items:center;gap:2px;padding:6px 8px;border-bottom:1px solid var(--line);flex:0 0 auto}
  #drawerBody{flex:1 1 auto;overflow-y:auto;padding:16px 18px 48px}
  #drawerGrip{position:absolute;left:0;top:0;width:7px;height:100%;cursor:ew-resize;z-index:3}
  #drawerGrip:hover{background:var(--accent-weak)}
  #drawerReopen{position:fixed;top:calc(var(--hdr-h,56px) + 10px);right:10px;z-index:29;
    width:34px;height:34px;border:1px solid var(--line-2);border-radius:9px;background:var(--panel);
    color:var(--sub);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:var(--sh-sm)}
  #drawerReopen:hover{background:var(--panel-2);color:var(--ink)}
  body.drawer-open #drawerReopen{display:none}
  #drawer .card{box-shadow:none;border:1px solid var(--line);padding:14px 16px;margin-bottom:14px}
  /* 主区滚动容器：滚动条落在被挤压主区右缘（右边栏左侧） */
  #scroll{position:fixed;left:0;right:0;top:var(--hdr-h,56px);bottom:0;overflow-y:auto;overflow-x:hidden;transition:right .26s ease}
  body.drawer-open #scroll{right:calc(var(--drawer-w) + 16px)}
  body.drawer-full #scroll{right:0}
  /* 滚动条：默认完全隐藏；仅"正在滚动(.show-sb)"或"鼠标压在滚动条本体上"时才显现 */
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:transparent;border-radius:8px}
  ::-webkit-scrollbar-thumb:hover{background:rgba(120,132,150,.6)}      /* 悬停滚动条本体 */
  .show-sb::-webkit-scrollbar-thumb{background:rgba(120,132,150,.45)}   /* 真实滚动时 */
  *{scrollbar-width:thin;scrollbar-color:transparent transparent}
  .show-sb{scrollbar-color:rgba(120,132,150,.45) transparent}
  /* 上传拖拽区 */
  .dropzone{border:1.5px dashed var(--line-2);border-radius:11px;padding:11px 16px;display:inline-flex;align-items:center;gap:9px;
    cursor:pointer;color:var(--sub);font-size:13px;background:var(--panel-2);transition:.15s;min-width:250px;max-width:340px}
  .dropzone:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-weak)}
  .dropzone.drag{border-color:var(--accent);background:var(--accent-weak);color:var(--accent)}
  .dropzone svg{flex:0 0 auto;opacity:.8}
  .dropzone .fz-count{margin-left:auto;font-size:11.5px;color:var(--muted);white-space:nowrap}
  /* 切片悬停操作条 + 小窗播放 */
  .clipcell{position:relative}
  .clipcell .clipbar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:6px;justify-content:center;padding:6px;
    background:linear-gradient(transparent,rgba(0,0,0,.5));opacity:0;transition:.15s;border-radius:0 0 8px 8px}
  .clipcell:hover .clipbar{opacity:1}
  .clipcell .clipbar button{background:rgba(255,255,255,.94);border:0;color:#1b2431;padding:4px 10px;font-size:12px;border-radius:7px;font-weight:600;box-shadow:none}
  .clipcell .clipbar button:hover{background:#fff}
  .pi-ctl{float:right;display:inline-flex;gap:2px;align-items:center}
  /* 小窗播放：浮窗、不挡页面交互、可拖动 */
  #clipPip{position:fixed;right:20px;bottom:20px;z-index:80;width:300px;background:#000;border-radius:12px;
    overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,.45);display:none}
  #clipPip.on{display:block}
  #clipPipBar{display:flex;align-items:center;justify-content:space-between;background:rgba(20,24,32,.96);color:#fff;
    padding:5px 6px 5px 10px;cursor:move;font-size:12px;user-select:none}
  #clipPipBar .x{background:transparent;border:0;color:#fff;font-size:14px;padding:2px 7px;cursor:pointer;box-shadow:none;font-weight:600}
  #clipPipBar .x:hover{background:rgba(255,255,255,.16)}
  #clipPip video{width:100%;display:block;background:#000;max-height:56vh}
  /* 登录页 + 弹窗 */
  #loginMask{position:fixed;inset:0;z-index:200;background:radial-gradient(1200px 600px at 50% -10%,#f2f6fd,#e4e9f2);display:none;align-items:center;justify-content:center}
  #loginMask.on{display:flex}
  .authcard{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:34px 34px 30px;width:360px;
    box-shadow:0 24px 60px rgba(16,24,40,.14),0 2px 8px rgba(16,24,40,.06);position:relative;overflow:hidden}
  .authcard::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#2f6bed,#5a52d8)}
  .auth-brand{font-size:22px;font-weight:800;letter-spacing:.3px;text-align:center;
    background:linear-gradient(90deg,#2f6bed,#5a52d8);-webkit-background-clip:text;background-clip:text;color:transparent}
  .authcard .sub{color:var(--muted);font-size:12.5px;margin:6px 0 20px;text-align:center}
  .authcard label{display:block;font-size:12px;color:var(--sub);margin:14px 0 5px}
  .authcard input[type=text],.authcard input[type=password]{width:100%;padding:10px 12px}
  .remember-row{display:flex;justify-content:flex-end;align-items:center;gap:7px;margin-top:14px;font-size:12.5px;color:var(--sub);user-select:none}
  .remember-row input{accent-color:var(--accent);width:15px;height:15px}
  .authcard button.primary{width:100%;margin-top:18px;padding:11px;font-size:14px;letter-spacing:2px;
    background:linear-gradient(90deg,#2f6bed,#5a52d8);color:#fff;border:0}
  .authcard button.primary:hover{filter:brightness(1.05);background:linear-gradient(90deg,#2f6bed,#5a52d8);color:#fff}
  .autherr{color:var(--pain);font-size:12.5px;margin-top:10px;min-height:16px;text-align:center}
  .modal{position:fixed;inset:0;z-index:150;background:rgba(16,24,40,.45);display:none;align-items:center;justify-content:center}
  .modal.on{display:flex}
  .modal .box{background:var(--panel);border-radius:14px;padding:20px 22px;width:min(560px,92vw);max-height:82vh;overflow:auto;box-shadow:var(--sh);position:relative}
  .modal .box h3{margin:0 0 14px}
  .modal .x{position:absolute;top:12px;right:14px}
  .utable{width:100%;font-size:13px}
  .utable td,.utable th{padding:7px 8px}
  .rolechip{font-size:11px;padding:1px 8px;border-radius:20px;background:var(--accent-weak);color:var(--accent)}
  .rolechip.user{background:var(--panel-2);color:var(--sub)}
  /* 头像 + 悬停菜单 */
  .usermenu{position:relative}
  .avatar{width:34px;height:34px;border-radius:50%;border:0;padding:0;cursor:pointer;font-weight:700;font-size:15px;color:#fff;
    display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#2f6bed,#5a52d8);box-shadow:var(--sh-sm)}
  .avatar:hover{filter:brightness(1.06);background:linear-gradient(135deg,#2f6bed,#5a52d8);color:#fff}
  .usermenu-pop{position:absolute;right:0;top:100%;margin-top:8px;min-width:180px;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:6px;display:none;z-index:60}
  /* 透明桥接：盖住头像与菜单之间的 8px 空隙，鼠标穿过不断悬停 */
  .usermenu-pop::before{content:"";position:absolute;left:0;right:0;top:-10px;height:10px;background:transparent}
  .usermenu:hover .usermenu-pop,.usermenu-pop:hover{display:block}
  .um-head{padding:7px 10px 9px;border-bottom:1px solid var(--line);margin-bottom:4px;font-size:13px}
  .um-item{display:block;width:100%;text-align:left;background:transparent;border:0;box-shadow:none;padding:9px 10px;
    border-radius:8px;font-size:13px;color:var(--ink);cursor:pointer;font-weight:500}
  .um-item:hover{background:var(--accent-weak);color:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>视频广告分析</h1>
  <span class="muted">OpenRouter Key</span>
  <input id="orkey" placeholder="留空=用服务端密钥" type="password" size="16"
         title="留空即可：默认使用服务端(Railway 变量)里配置的 OpenRouter 密钥。只有想临时换一把 key 时才填，填了只保存在你本地浏览器，不会上传保存">
  <button class="eye" onclick="toggleEye('orkey',this)" title="显示/隐藏">👁</button>
  <span class="muted">DeepSeek Key</span>
  <input id="dskey" placeholder="留空=用服务端密钥" type="password" size="16"
         title="翻译（中→英）用的 DeepSeek 密钥。留空即用服务端(Railway 变量)里的 DEEPSEEK_API_KEY。填了只存本地浏览器，不上传保存">
  <button class="eye" onclick="toggleEye('dskey',this)" title="显示/隐藏">👁</button>
  <span class="muted">分组名</span>
  <input id="project" placeholder="如 test" size="10"
         title="一批广告用同一个分组名。R2 里按 projects/{分组名}/{广告}/ 存放，分析和横向对比也按分组为单位">
  <button onclick="loadAll()">加载结果</button>
  <span id="status" class="muted"></span>
  <span id="userbox" style="margin-left:auto;display:flex;gap:12px;align-items:center">
    <button onclick="location.href='/prompts'" title="自定义各环节分析提示词（存本机浏览器）">提示词修改</button>
    <div id="userMenu" class="usermenu">
      <button class="avatar" id="avatarBtn" title="账号">U</button>
      <div class="usermenu-pop">
        <div class="um-head"><b id="um-name"></b> <span id="um-role" class="muted"></span></div>
        <button class="um-item" onclick="location.href='/account'">个人中心</button>
        <button class="um-item" onclick="location.href='/account'">账号设置</button>
        <button class="um-item" id="um-admin" style="display:none" onclick="location.href='/admin'">后台管理</button>
      </div>
    </div>
  </span>
</header>
<div id="scroll">
<main>
  <div class="card" id="ops">
    <h2>操作</h2>
    <div class="row">
      <b>① 拆分</b>
      <div class="dropzone" id="dropzone" onclick="document.getElementById('files').click()"
           title="拖入本地视频，或点击选择（可多选）。文件名将作为广告 id">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="M8 8l4-4 4 4"/><path d="M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg>
        <span id="dz-text">拖入视频，或点击选择（可多选）</span>
        <span class="fz-count" id="dz-count"></span>
      </div>
      <input type="file" id="files" accept="video/*" multiple style="display:none" onchange="onFilesPicked()">
      <button id="btnSplit" onclick="doSplit()">上传并拆分</button>
      <select id="engine" title="拆分引擎">
        <option value="gpu">GPU · 快</option>
        <option value="cpu">CPU · 慢</option>
      </select>
      <label class="ck"><input type="checkbox" id="fast" title="不重编码，快但可能重复/不准"> 快速切分</label>
      <label class="ck"><input type="checkbox" id="keepraw"> 保留原视频</label>
    </div>
    <div class="row">
      <b style="visibility:hidden">①</b>

<script>
const $=s=>document.querySelector(s);
const proj=()=>$('#project').value.trim();

// ===== 登录 / 鉴权 =====
let _token=null,_user='',_role='';
const tok=()=>_token;                                   // 兼容旧的 if(!tok()) 守卫
const headers=()=>_token?{'Authorization':'Bearer '+_token}:{};
function _loadToken(){try{return localStorage.getItem('authToken')||sessionStorage.getItem('authToken')||null}catch(e){return null}}
function _saveToken(t,remember){_token=t;try{if(remember){localStorage.setItem('authToken',t);sessionStorage.removeItem('authToken')}else{sessionStorage.setItem('authToken',t);localStorage.removeItem('authToken')}}catch(e){}}
function _clearToken(){_token=null;try{localStorage.removeItem('authToken');sessionStorage.removeItem('authToken')}catch(e){}}
function showLogin(){$('#loginMask').classList.add('on')}
function hideLogin(){$('#loginMask').classList.remove('on')}
function applyUser(u,r){_user=u;_role=r;
  const nm=$('#um-name');if(nm)nm.textContent=u;
  const rl=$('#um-role');if(rl)rl.textContent=(r==='admin'?'· 管理员':'');   // 成员不显示角色
  const av=$('#avatarBtn');if(av)av.textContent=(u||'?').slice(0,1).toUpperCase();
  const uu=$('#um-admin');if(uu)uu.style.display=(r==='admin'?'':'none');}
async function doLogin(){
  const err=$('#lg_err');err.textContent='';
  const username=$('#lg_user').value.trim(),pin=$('#lg_pin').value,remember=$('#lg_remember').checked;
  if(!username){err.textContent='请输入用户名';return}
  try{
    const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,pin,remember})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||!d.ok){err.textContent=(d&&d.detail)||'登录失败';return}
    _saveToken(d.token,remember);applyUser(d.username,d.role);hideLogin();$('#lg_pin').value='';afterLogin();
  }catch(e){err.textContent='登录失败：'+e.message}
}
function doLogout(){_clearToken();_user='';_role='';showLogin()}
function onAuthFail(){_clearToken();showLogin()}
async function afterLogin(){try{await loadAll()}catch(e){}}
async function bootAuth(){
  _token=_loadToken();
  if(!_token){showLogin();return}
  try{const r=await fetch('/auth/me?login=1',{headers:headers()});if(!r.ok)throw 0;
    const d=await r.json();applyUser(d.username,d.role);hideLogin();afterLogin();
  }catch(e){_clearToken();showLogin()}
}

    const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok){err.textContent=(d&&d.detail)||'修改失败';return}
    closePin();alert('密码已修改，请重新登录');doLogout();

function closeAccount(){$('#accountModal').classList.remove('on')}

async function _uPost(path,body){const r=await fetch(path,{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok){alert((d&&d.detail)||'操作失败');return false}return true}
async function renderUsers(){
  const box=$('#usersList');box.innerHTML='<div class="muted">加载中…</div>';
  try{const d=await api('/users');let h='<table class="utable"><tr><th>用户名</th><th>角色</th><th>状态</th><th>操作</th></tr>';

      h+='<tr><td>'+u.username+(me?'（我）':'')+'</td>'

async function createUser(){const username=$('#nu_user').value.trim(),pin=$('#nu_pin').value,role=$('#nu_role').value;if(!username){alert('填用户名');return}if(await _uPost('/users',{username,pin,role})){$('#nu_user').value='';$('#nu_pin').value='';renderUsers()}}
async function setRole(username,role){if(await _uPost('/users/role',{username,role}))renderUsers()}
async function resetPin(username){const pin=prompt('给「'+username+'」设置新密码：');if(pin==null)return;if(await _uPost('/users/reset_pin',{username,pin}))alert('已重置')}
async function toggleDisable(username,disabled){if(await _uPost('/users/disable',{username,disabled}))renderUsers()}
async function delUser(username){if(!confirm('删除用户 '+username+'？'))return;if(await _uPost('/users/delete',{username}))renderUsers()}
const setStatus=t=>$('#status').textContent=t||'';
$('#project').value=localStorage.getItem('proj')||'test';
$('#product').value=localStorage.getItem('prod')||'';
$('#hyp').value=localStorage.getItem('hyp')||'';
$('#engine').value=localStorage.getItem('eng')||'gpu';
$('#orkey').value=localStorage.getItem('ork')||'';
$('#dskey').value=localStorage.getItem('dsk')||'';
function remember(){localStorage.setItem('proj',proj());localStorage.setItem('prod',$('#product').value.trim());localStorage.setItem('hyp',$('#hyp').value.trim());localStorage.setItem('eng',$('#engine').value);localStorage.setItem('ork',$('#orkey').value.trim());localStorage.setItem('dsk',$('#dskey').value.trim())}

function setOps(t){$('#status').textContent=t||''}
function logOps(t){const l=$('#opslog');l.textContent+=t+'\n';l.scrollTop=l.scrollHeight}

async function api(path){const r=await fetch(path,{headers:headers()});if(r.status===401){onAuthFail();throw new Error('401 未登录')}if(!r.ok)throw new Error(path+' -> '+r.status);return r.json()}

// 轮询 /jobs 直到指定任务完成，返回该任务
async function waitJob(jid,onTick){
  while(true){
    await new Promise(r=>setTimeout(r,4000));
    try{
      const jd=await api('/jobs?limit=40');
      loadJobs();
      const job=(jd.jobs||[]).find(j=>j.id===jid);
      if(job && job.status!=='running') return job;
      if(onTick)onTick();
    }catch(e){}
  }
}

// ===== 上传：拖拽 + 计数 =====
function onFilesPicked(){
  const n=$('#files').files.length;
  $('#dz-count').textContent=n?(n+' 个'):'';
  $('#dz-text').textContent=n?('已选 '+n+' 个视频，可继续拖入/点击追加'):'拖入视频，或点击选择（可多选）';
}
function wireDrop(){
  const dz=$('#dropzone');if(!dz)return;
  ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();e.stopPropagation();dz.classList.add('drag');}));
  ['dragleave','dragend','drop'].forEach(ev=>dz.addEventListener(ev,e=>{if(ev!=='drop'){e.preventDefault();e.stopPropagation();}dz.classList.remove('drag');}));
  dz.addEventListener('drop',e=>{e.preventDefault();e.stopPropagation();
    const dropped=[...(e.dataTransfer.files||[])].filter(f=>(f.type||'').startsWith('video/')||/\.(mp4|mov|mkv|avi|webm|m4v)$/i.test(f.name));
    if(!dropped.length){alert('请拖入视频文件');return;}
    const dt=new DataTransfer();
    [...$('#files').files].forEach(f=>dt.items.add(f));   // 保留已选，追加
    dropped.forEach(f=>dt.items.add(f));
    $('#files').files=dt.files;onFilesPicked();
  });
}
// ===== 操作 =====
async function doSplit(){
  remember();const files=$('#files').files;
  const total=files.length+_urlList.length;
  if(!total){alert('先选视频文件或粘贴视频 URL');return}
  if(!tok()){alert('先填访问密码');return}
  $('#btnSplit').disabled=true;
  const batch=await genBatchId();_curBatch=batch;localStorage.setItem('curBatch',batch);
  logOps('▶ 本次批次：'+batch+'（'+files.length+' 本地 + '+_urlList.length+' URL，合为一个任务）');
  const fd=new FormData();fd.append('project_id',proj());fd.append('batch',batch);
  fd.append('engine',$('#engine').value);fd.append('precise',$('#fast').checked?'false':'true');
  fd.append('keep_raw',$('#keepraw').checked?'true':'false');
  for(let i=0;i<files.length;i++)fd.append('files',files[i]);
  if(_urlList.length)fd.append('urls',JSON.stringify(_urlList));
  setStatus('上传拆分中…（'+total+' 个视频，后台运行）');
  try{
    const r=await fetch('/split_batch',{method:'POST',headers:headers(),body:fd});
    const d=await r.json();
    if(!d.started){logOps('✗ 提交失败 '+(d.error||r.status));$('#btnSplit').disabled=false;setStatus('提交失败');return}
    logOps('▶ 已提交批次拆分（任务#'+d.job_id+'，'+d.n+' 个视频），处理中…可离开');
    const job=await waitJob(d.job_id);
    logOps((job.ok?'✓':'✗')+' 批次拆分：'+(job.detail||''));
  }catch(e){logOps('✗ 拆分失败 '+e.message)}
  _urlList=[];renderUrlChips();$('#files').value='';onFilesPicked();setStatus('拆分完成，可点「开始分析本批次」');$('#btnSplit').disabled=false;loadJobs();
}

async function doAnalyze(){
  remember();if(!tok()){alert('先填访问密码');return}
  $('#btnAnalyze').disabled=true;
  const batch=_curBatch||localStorage.getItem('curBatch')||'';
  if(!batch){ if(!confirm('本次没有先上传拆分，未指定批次。\n确定分析整个分组（会把分组内所有批次一起归纳共性）？'))return; }
  const body={project_id:proj(),product:$('#product').value.trim()||'产品',
    cross_compare:$('#cc').checked,pro:$('#pro').checked,overwrite:$('#ow').checked,
    hypotheses:$('#hyp').value.trim()||null,
    openrouter_key:$('#orkey').value.trim()||null,
    deepseek_key:$('#dskey').value.trim()||null,
    batch:batch||null,
    custom_prompts:(()=>{try{const o=JSON.parse(localStorage.getItem('customPrompts')||'{}');return Object.keys(o).length?o:null}catch(e){return null}})()};
  setStatus('提交分析…');logOps('▶ 提交分析 '+(batch?('批次 '+batch):('整个分组 '+proj()))+' …');
  let jid=null;
  try{
    const r=await fetch('/analyze',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    if(!d.started){logOps('✗ 启动失败');setStatus('启动失败');$('#btnAnalyze').disabled=false;return}
    jid=d.job_id;
    logOps('▶ 已在后台开始（任务#'+jid+'），分析中…可以离开，稍后回来看');
  }catch(e){logOps('✗ 提交失败 '+e.message);setStatus('提交失败');$('#btnAnalyze').disabled=false;return}

  setStatus('分析中…（后台运行，自动刷新）');
  const timer=setInterval(async()=>{
    try{
      const jd=await api('/jobs?limit=30');
      const job=(jd.jobs||[]).find(j=>j.id===jid);
      if(job && job.status!=='running'){
        clearInterval(timer);$('#btnAnalyze').disabled=false;
        logOps(job.ok?('✓ 分析完成（#'+jid+'，'+job.duration_sec+'s）'):('✗ 分析失败（#'+jid+'）'));
        setStatus(job.ok?'分析完成':'分析失败');
        if(job.ok)loadAll();else loadJobs();
      }else{loadJobs()}
    }catch(e){}
  },5000);
}

// ===== 查看 =====
// 图标（无文字）：复制=重叠圆角矩形，下载=箭头入托盘，完成=勾
const IC={

  ok:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>',
  expand:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>',
  shrink:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg>'};
function markDone(btn){        // 成功后变勾；鼠标离开或 2s 后恢复
  const o=btn.dataset.ic||btn.innerHTML;btn.dataset.ic=o;btn.innerHTML=IC.ok;btn.classList.add('done-ic');
  const revert=()=>{btn.innerHTML=o;btn.classList.remove('done-ic');btn.removeEventListener('mouseleave',revert);clearTimeout(tm);};
  const tm=setTimeout(revert,2000);btn.addEventListener('mouseleave',revert);
}
function copyBtn(t){const b=document.createElement('button');b.className='copy';b.title='复制';b.innerHTML=IC.copy;
  b.dataset.ic=IC.copy;b.onclick=e=>{e.stopPropagation();navigator.clipboard.writeText(t);markDone(b);};return b}
function promptBlock(t){const d=document.createElement('div');d.className='prompt';d.textContent=t;d.appendChild(copyBtn(t));return d}
// 滚动条：真实滚动时显现；鼠标移到滚动条边缘带时显现并一直保持，移走才隐藏
function wireScrollbars(){
  ['#scroll','#drawerBody','#jobs','#opslog'].forEach(sel=>{const el=$(sel);if(!el||el._sb)return;el._sb=1;let tmr=null;
    const show=()=>el.classList.add('show-sb');
    const hideSoon=(ms)=>{clearTimeout(tmr);tmr=setTimeout(()=>el.classList.remove('show-sb'),ms||700);};
    el.addEventListener('scroll',()=>{show();hideSoon(900);});
    el.addEventListener('mousemove',e=>{
      const r=el.getBoundingClientRect();
      const nearV=(el.scrollHeight>el.clientHeight+2)&&(r.right-e.clientX)<=16&&(r.right-e.clientX)>=-2;
      const nearH=(el.scrollWidth>el.clientWidth+2)&&(r.bottom-e.clientY)<=16&&(r.bottom-e.clientY)>=-2;
      if(nearV||nearH){clearTimeout(tmr);show();}   // 停在滚动条带上就保持显示
      else hideSoon();
    });
    el.addEventListener('mouseleave',()=>hideSoon());
  });
}
function tags(a,cls){const w=document.createElement('div');w.className='tags';(a||[]).forEach(t=>{const s=document.createElement('span');s.className='tag'+(cls?' '+cls:'');s.textContent=t;w.appendChild(s)});return w}

function addUrl(){
  const el=$('#vurl');const u=(el.value||'').trim();
  if(!u){return}
  if(!/^https?:\/\//i.test(u)){alert('请输入 http/https 开头的视频直链');return}
  _urlList.push(u);el.value='';renderUrlChips();
}
function renderUrlChips(){
  const box=$('#urlchips');box.innerHTML='';
  _urlList.forEach((u,i)=>{
    const s=document.createElement('span');s.className='tag';s.style.cursor='default';
    s.textContent=(u.length>34?u.slice(0,34)+'…':u)+' ';
    const x=document.createElement('a');x.href='javascript:void 0';x.textContent='✕';x.style.cssText='margin-left:4px;color:var(--pain);text-decoration:none';
    x.onclick=()=>{_urlList.splice(i,1);renderUrlChips()};

  });
}
// 任务编号：日期-产品名-序号（当天同产品从 001 递增）
async function genBatchId(){
  const d=new Date(),z=n=>String(n).padStart(2,'0');
  const date=''+d.getFullYear()+z(d.getMonth()+1)+z(d.getDate());
  const prod=($('#product').value.trim()||'产品').replace(/[\/\\\s]+/g,'');
  const pfx=date+'-'+prod+'-';
  let maxN=0;
  try{const jd=await api('/jobs?limit=200');(jd.jobs||[]).forEach(j=>{
    if(j.batch&&j.batch.indexOf(pfx)===0){const m=/-(\d+)$/.exec(j.batch);if(m){const n=parseInt(m[1],10);if(n>maxN)maxN=n;}}});
  }catch(e){}
  return pfx+String(maxN+1).padStart(3,'0');
}

async function loadFavs(){
  try{const r=await fetch('/fav/list',{headers:headers()});if(r.status===401){onAuthFail();throw 0}if(!r.ok)throw 0;
    const d=await r.json();_favData=d.favorites||[];
    _favMine={};_favData.forEach(f=>{if(f.owner===_user)_favMine[f.ref]=f.id;});
    _favSet=new Set(Object.keys(_favMine));}
  catch(e){_favData=[];_favSet=new Set();_favMine={};}
}
async function favApi(path,body){
  const r=await fetch(path,{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.status===401){onAuthFail();throw new Error('401')}
  if(!r.ok)throw new Error(path+' -> '+r.status);return r.json();
}
function favStar(kind,ref,label,meta){
  const b=document.createElement('button');b.className='fav-star';b.type='button';
  const on=_favSet.has(ref);b.textContent=on?'★':'☆';if(on)b.classList.add('on');
  b.title=on?'取消收藏':'收藏';
  b.onclick=e=>{e.stopPropagation();e.preventDefault();toggleFav(kind,ref,label,meta,b);};
  return b;
}
async function toggleFav(kind,ref,label,meta,btn){
  const on=_favSet.has(ref);
  try{
    if(on){await favApi('/fav/remove',{id:_favMine[ref]});_favSet.delete(ref);
           _favData=_favData.filter(f=>!(f.ref===ref&&f.owner===_user));delete _favMine[ref];}
    else{const d=await favApi('/fav/add',{kind,ref,label:label||'',meta:meta||{}});_favSet.add(ref);
         _favMine[ref]=d.id;_favData.unshift({id:d.id,owner:_user,kind,ref,label:label||'',meta:meta||{}});}
  }catch(e){alert('收藏操作失败：'+e.message);return;}
  if(btn){const nb=_favSet.has(ref);btn.textContent=nb?'★':'☆';btn.classList.toggle('on',nb);btn.title=nb?'取消收藏':'收藏';}
  if(_drawerMode==='fav')renderDrawer();
  document.querySelectorAll('#jobs .fav-star').forEach(s=>{if(s.dataset.ref===ref){const nb=_favSet.has(ref);s.textContent=nb?'★':'☆';s.classList.toggle('on',nb);}});
}

async function viewJob(kind,ref,batch,detail,status,owner,project){
  if(status==='error'&&detail){logOps('✗ 任务失败原因：'+detail);return}
  // 切到该任务归属的 (创建人, 分组)，强制重新加载其结果
  const no=owner||_user,np=project||proj();
  if(no!==_ctxOwner||np!==_ctxProject){_ctxOwner=no;_ctxProject=np;_res=null;}
  await ensureResult(true);
  if(!_res)return;
  await loadFavs();        // 刷新收藏态
  _drawerMode='all';
  renderDrawer();          // 确保右栏内容为最新
  openDrawer();            // 展开并列侧栏（不再在主区下方展开）
  focusBatch(batch||ref);  // 定位到该任务批次并全部展开
}
// 在右栏定位到某批次：展开其全部 details 并平滑滚动、高亮

async function delJob(id,kind,ref,batch,owner,project){
  const pj=project||proj(),ow=owner||_user;
  let msg,delReq=null;
  if(kind==='split'&&ref){
    msg='删除任务 #'+id+'（拆分 '+ref+'）\n\n将删除该广告在 R2 的全部文件（切片+分析产物+原视频），不可恢复。确定？';
    delReq={project_id:pj,owner:ow,batch:batch||null,ad_id:ref,analysis_only:false,clear_jobs:false};
  }else if(kind==='analyze'){
    msg='删除任务 #'+id+'（分析批次 '+(batch||ref)+'）\n\n将删除该批次在 R2 的全部文件（所有广告切片+分析产物+共性+原视频）及该批次任务记录，不可恢复。确定？';
    delReq={project_id:pj,owner:ow,batch:(batch||ref)||null,ad_id:null,analysis_only:false,clear_jobs:true};
  }else{
    msg='删除任务记录 #'+id+'？';
  }
  if(!confirm(msg))return;
  if(delReq){
    try{
      const r=await fetch('/delete',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify(delReq)});
      const d=await r.json();
      logOps(d.ok?('✓ 已删除 R2 文件 '+d.deleted+' 个（'+d.scope+'）'+(d.jobs_deleted?('，任务记录 '+d.jobs_deleted+' 条'):'')):('✗ 删文件失败 '+(d.detail||r.status)));
    }catch(e){logOps('✗ 删文件失败 '+e.message)}
  }
  try{
    await fetch('/jobs/delete',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify({job_id:id})});
    logOps('✓ 已删除任务记录 #'+id);
  }catch(e){logOps('✗ 删记录失败 '+e.message)}
  loadJobs();loadAll();
}

function fmtCost(j){
  const c=Number(j.cost_usd||0);
  if(!c)return j.kind==='split'&&j.engine==='cpu'?'含订阅':'-';
  const cny=(c*7.2).toFixed(3);
  return (j.cost_exact===false?'≈':'')+'$'+c.toFixed(4)+' (¥'+cny+')';
}

function adFromKey(k,pid){const rest=k.replace('projects/'+pid+'/','');const p=rest.split('/');return p.length>=2?p[0]:null}

let _ctxOwner='',_ctxProject='';
function resQuery(){return 'project_id='+encodeURIComponent(_ctxProject||proj())+'&owner='+encodeURIComponent(_ctxOwner||_user);}
async function loadAll(){
  remember();setStatus('加载中…');_ctxOwner=_user;_ctxProject=proj();

// 拉取并解析 /result，按「批次」分组缓存到 _res
function parseKey(k,pid){
  const rest=k.slice(('projects/'+pid+'/').length);
  const parts=rest.split('/');
  if(parts.length<2)return null;
  // projects/{pid}/{batch}/共性镜头prompt.json → depth2, ad=null
  // projects/{pid}/{batch}/{ad}/... → depth>=3
  return {batch:parts[0], ad:(parts.length>=3?parts[1]:null), last:parts[parts.length-1]};
}
// 把一次 /result 响应合并进 _res.batches（可多次调用做增量填充）
function _mergeResult(data){
  const pid=_ctxProject||proj();
  if(!_res)_res={batches:{},count:0};
  const batches=_res.batches;
  const B=b=>batches[b]||(batches[b]={ads:{},vids:{},common:null});
  for(const [k,v] of Object.entries(data.reports||{})){
    const info=parseKey(k,pid);if(!info)continue;
    if(k.endsWith('共性镜头prompt.en.json')&&info.ad===null){B(info.batch).common_en=v;continue}
    if(k.endsWith('共性镜头prompt.json')&&info.ad===null){B(info.batch).common=v;continue}
    if(!info.ad)continue;
    const bo=B(info.batch);const A=bo.ads[info.ad]||(bo.ads[info.ad]={});
    if(k.endsWith('ad_aggregate.en.json'))A.agg_en=v;
    else if(k.endsWith('video_prompt.en.json'))A.vp_en=v;
    else if(k.endsWith('shot_prompts.en.json'))A.sp_en=v;
    else if(k.endsWith('ad_aggregate.json'))A.agg=v;
    else if(k.endsWith('video_prompt.json'))A.vp=v;
    else if(k.endsWith('shot_prompts.json'))A.sp=v;
    else if(k.endsWith('source.json'))A.source=(v&&v.url)||'';
  }
  (data.objects||[]).forEach(o=>{if(o.key.endsWith('.mp4')){const info=parseKey(o.key,pid);if(info&&info.ad){const bo=B(info.batch);if(!bo.ads[info.ad])bo.ads[info.ad]={};(bo.vids[info.ad]=bo.vids[info.ad]||[]);if(!bo.vids[info.ad].includes(o.url))bo.vids[info.ad].push(o.url)}}});
  if(data.count)_res.count=Math.max(_res.count||0,data.count);
}
async function ensureResult(force){
  if(_res&&!force)return _res;
  let data;try{data=await api('/result?'+resQuery())}
  catch(e){_res=null;
    if((''+e.message).includes('404')){setStatus('该分组不存在或暂无产物');$('#results').innerHTML='<div class="muted" style="padding:6px">该分组不存在或暂无产物</div>';renderDrawer();}
    else setStatus('加载失败：'+e.message);
    return null;}
  _res={batches:{},count:data.count};_mergeResult(data);
  setStatus('共 '+_res.count+' 个对象 · '+Object.keys(_res.batches).length+' 个批次');
  return _res;
}
// 渐进加载：先出骨架（批次+切片），再逐批次拉内容，每拉完一批就刷新显示
async function loadResultsProgressive(){
  _res=null;
  let list;
  try{list=await api('/result?include_content=false&'+resQuery())}
  catch(e){
    if((''+e.message).includes('404')){setStatus('该分组暂无产物');_res=null;_drawerMode='all';renderDrawer();return;}
    setStatus('加载失败：'+e.message);return;}
  _res={batches:{},count:list.count};_mergeResult(list);
  _drawerMode='all';renderDrawer();               // 立即显示批次骨架+切片
  const bs=Object.keys(_res.batches).sort().reverse();  // 新批次先出
  let done=0;
  for(const b of bs){
    try{const bd=await api('/result?'+resQuery()+'&batch='+encodeURIComponent(b));
      _mergeResult(bd);}catch(e){}
    done++;setStatus('已加载 '+done+'/'+bs.length+' 批次…');renderDrawer();
  }
  setStatus('共 '+_res.count+' 个对象 · '+bs.length+' 个批次');
}

function wirePip(){
  const bar=$('#clipPipBar'),pip=$('#clipPip');if(!bar||!pip||pip._w)return;pip._w=1;
  let sx,sy,ox,oy,drag=false;
  bar.addEventListener('mousedown',e=>{if(e.target.classList&&e.target.classList.contains('x'))return;
    drag=true;const r=pip.getBoundingClientRect();sx=e.clientX;sy=e.clientY;ox=r.left;oy=r.top;
    pip.style.right='auto';pip.style.bottom='auto';pip.style.left=ox+'px';pip.style.top=oy+'px';e.preventDefault();});
  window.addEventListener('mousemove',e=>{if(!drag)return;

// 卖点框：每个卖点一个 chip，− 删除、+ / 回车新增，无需逗号
function sellingChips(cur){
  const box=document.createElement('div');box.style.cssText='display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px;align-items:center';
  const items=(cur||[]).slice();
  const inp=document.createElement('input');inp.type='text';inp.placeholder='加卖点';
  inp.style.cssText='border:1px solid var(--line-2);border-radius:6px;padding:4px 8px;font-size:12px;width:90px';
  const add=document.createElement('button');add.type='button';add.className='mini';add.textContent='+';add.title='新增卖点';add.style.margin='0';
  function chip(text){
    const c=document.createElement('span');c.className='tag';c.style.cssText='display:inline-flex;align-items:center;gap:5px';
    c.appendChild(document.createTextNode(text));
    const x=document.createElement('button');x.type='button';x.textContent='−';x.title='删除';
    x.style.cssText='border:0;background:transparent;color:var(--pain);font-size:15px;line-height:1;padding:0;cursor:pointer;font-weight:700';
    x.onclick=()=>{const i=items.indexOf(text);if(i>=0){items.splice(i,1);render();}};
    c.appendChild(x);return c;
  }
  function render(){box.innerHTML='';items.forEach(t=>box.appendChild(chip(t)));box.appendChild(inp);box.appendChild(add);}
  const doAdd=()=>{const v=inp.value.trim();if(v&&!items.includes(v)){items.push(v);inp.value='';render();}inp.focus();};
  add.onclick=doAdd;inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();doAdd();}};
  render();box._get=()=>items.slice();return box;
}
async function doRevise(ptype,ctx,sellingBox,ta,btn){
  if(!tok()){alert('先填访问密码');return}
  const instruction=(ta.value||'').trim();
  let selling=null;
  if(sellingBox){selling=sellingBox._get();}
  if(!instruction&&(!selling||!selling.length)){alert('请填写新卖点或修改需求');return}
  btn.disabled=true;btn.textContent='提交中…';
  const body={project_id:(_ctxProject||proj()),owner:(_ctxOwner||_user),batch:ctx.batch||'',ad:(ptype==='common'?'':(ctx.ad||'')),ptype:ptype,
    idx:(ctx.idx!=null?ctx.idx:null),selling:selling,instruction:instruction,
    product:$('#product').value.trim()||'',
    openrouter_key:$('#orkey').value.trim()||null,deepseek_key:$('#dskey').value.trim()||null,
    custom_prompts:(()=>{try{const o=JSON.parse(localStorage.getItem('customPrompts')||'{}');return Object.keys(o).length?o:null}catch(e){return null}})()};
  try{
    const r=await fetch('/prompt/revise',{method:'POST',headers:{...headers(),'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d=await r.json();
    if(!d.started){alert('提交失败 '+(d.detail||r.status));btn.disabled=false;btn.textContent='应用修改';return}
    logOps('▶ 提示词修改任务 #'+d.job_id+' 处理中…');
    const job=await waitJob(d.job_id);
    logOps((job.ok?'✓':'✗')+' 提示词修改：'+(job.detail||''));
    if(job.ok){const m=_drawerMode;await ensureResult(true);_drawerMode=m;renderDrawer();}
    else alert('修改失败：'+(job.detail||''));
  }catch(e){alert('修改失败：'+e.message);}
  btn.disabled=false;btn.textContent='应用修改';
}

  _fillEn(en,enId,getEn,renderEn);
  bz.onclick=()=>{zh.style.display='';en.style.display='none';bz.className='on';be.className='';};
  be.onclick=()=>{zh.style.display='none';en.style.display='';be.className='on';bz.className='';_fillEn(en,enId,getEn,renderEn);};
  bar.appendChild(bz);bar.appendChild(be);wrap.appendChild(bar);wrap.appendChild(zh);wrap.appendChild(en);
  return wrap;
}
function _fillEn(en,enId,getEn,renderEn){
  const d=getEn();en.innerHTML='';
  if(d){en.appendChild(renderEn(d));delete _enReg[enId];}
  else{const w=document.createElement('div');w.className='bi-en-wait';w.textContent='正在翻译中…';en.appendChild(w);
       _enReg[enId]={get:getEn,render:renderEn,pane:en};startEnPoll();}
}
function startEnPoll(){
  if(_enTimer)return;let tries=0;
  _enTimer=setInterval(async()=>{
    if(!Object.keys(_enReg).length||tries>40){clearInterval(_enTimer);_enTimer=null;return;}
    tries++;
    try{await ensureResult(true);}catch(e){return;}
    Object.keys(_enReg).forEach(id=>{const r=_enReg[id];const d=r.get();
      if(d){r.pane.innerHTML='';r.pane.appendChild(r.render(d));delete _enReg[id];}});
  },6000);
}

// 单条提示词：prompt 级中/EN 切换 + ⭐(提示词与切片同步收藏) + ▶(小窗播放原镜头) + 修改
function clipForShot(videos,it,i){
  videos=videos||[];if(!videos.length)return null;
  if(it&&it.shot_id){const m=videos.find(u=>u.includes(it.shot_id));if(m)return m;}
  return videos[i]||null;
}
function promptItemFull(o){
  const it=o.zhItem||{};
  const d=document.createElement('details');d.open=true;d.className='pi';
  const sm=document.createElement('summary');
  const title=it.标题||it.id||('镜头'+((o.idx||0)+1));
  sm.appendChild(document.createTextNode(title));
  const ctl=document.createElement('span');ctl.className='pi-ctl';
  const bar=document.createElement('div');bar.className='bi-tabs';
  const bz=document.createElement('button');bz.textContent='中';bz.className='on';
  const be=document.createElement('button');be.textContent='EN';
  bar.appendChild(bz);bar.appendChild(be);ctl.appendChild(bar);
  if(o.clipUrl){const pb=document.createElement('button');pb.className='iconbtn';pb.title='小窗播放原镜头片段';pb.textContent='▶';
    pb.onclick=e=>{e.stopPropagation();e.preventDefault();openClip(o.clipUrl);};ctl.appendChild(pb);}
  const ref='prompt|'+(o.owner||'')+'|'+o.project+'|'+o.batch+'|'+(o.ad||'common')+'|'+o.ptype+'|'+(o.idx||0);
  const meta={owner:o.owner,project:o.project,batch:o.batch,ad:o.ad,ptype:o.ptype,idx:o.idx,title:title,text:it.prompt||'',卖点:it.卖点||[]};
  if(o.clipUrl){meta.clipUrl=o.clipUrl;meta.name=(o.clipUrl.split('/').pop()||'').split('?')[0];}
  ctl.appendChild(favStar('prompt',ref,title,meta));
  sm.appendChild(ctl);d.appendChild(sm);
  const zhPane=document.createElement('div');
  zhPane.appendChild(tags(it.卖点));zhPane.appendChild(promptBlock(it.prompt||''));
  zhPane.appendChild(reviseEditor(o.ptype,{project:o.project,batch:o.batch,ad:o.ad,ptype:o.ptype,idx:o.idx,lang:'zh'},it.卖点||[]));
  const enPane=document.createElement('div');enPane.style.display='none';
  const enId='enitem|'+o.project+'|'+o.batch+'|'+(o.ad||'common')+'|'+o.ptype+'|'+o.idx;
  _fillEnItem(enPane,enId,o.getEnItem);
  bz.onclick=e=>{e.stopPropagation();e.preventDefault();zhPane.style.display='';enPane.style.display='none';bz.className='on';be.className='';};
  be.onclick=e=>{e.stopPropagation();e.preventDefault();zhPane.style.display='none';enPane.style.display='';be.className='on';bz.className='';_fillEnItem(enPane,enId,o.getEnItem);};
  d.appendChild(zhPane);d.appendChild(enPane);
  return d;
}
function _enItemNode(e){const f=document.createDocumentFragment();if(e.卖点)f.appendChild(tags(e.卖点));f.appendChild(promptBlock(e.prompt||e.video_prompt_text||''));return f;}
function _fillEnItem(pane,enId,getEn){
  const e=getEn&&getEn();pane.innerHTML='';
  if(e&&(e.prompt||e.video_prompt_text)){pane.appendChild(_enItemNode(e));delete _enReg[enId];}
  else{const w=document.createElement('div');w.className='bi-en-wait';w.textContent='正在翻译中…';pane.appendChild(w);
    _enReg[enId]={get:()=>{const x=getEn&&getEn();return (x&&(x.prompt||x.video_prompt_text))?x:null;},render:_enItemNode,pane:pane};
    startEnPoll();}
}
// 分块构造器：中英复用同一套（英文 JSON 字段与中文一致）
function buildAggBox(agg){
  agg=agg||{};const f=document.createDocumentFragment();
  if(agg.广告主张){const p=document.createElement('div');p.style.margin='6px 0';p.innerHTML='<b>主张：</b>'+agg.广告主张;f.appendChild(p);}
  if(agg.商品卖点){const h=document.createElement('h3');h.textContent='卖点';f.appendChild(h);f.appendChild(tags(agg.商品卖点));}
  if(agg.解决痛点){const h=document.createElement('h3');h.textContent='痛点';f.appendChild(h);f.appendChild(tags(agg.解决痛点,'pain'));}
  return f;
}
function buildVpBox(vp,ctx){
  vp=vp||{};const det=document.createElement('details');det.open=true;
  const sm=document.createElement('summary');sm.textContent='视频级脚本 prompt';
  if(ctx){const ref='prompt|'+(ctx.owner||'')+'|'+ctx.project+'|'+ctx.batch+'|'+ctx.ad+'|video|'+ctx.lang;
    const meta={owner:ctx.owner,project:ctx.project,batch:ctx.batch,ad:ctx.ad,ptype:'video',lang:ctx.lang,title:'视频级脚本 prompt',text:vp.video_prompt_text||''};
    sm.appendChild(favStar('prompt',ref,'视频级脚本 prompt',meta));}
  det.appendChild(sm);
  det.appendChild(promptBlock(vp.video_prompt_text||''));
  if(ctx&&ctx.lang==='zh')det.appendChild(reviseEditor('video',ctx,null));
  return det;
}
function buildSpBox(sp,ctx,videos){
  const list=((sp||{}).镜头级prompt列表)||[];const det=document.createElement('details');det.open=true;
  const sm=document.createElement('summary');sm.textContent='镜头 prompt 素材（'+list.length+' 条 · 逐镜头）';det.appendChild(sm);
  list.forEach((it,i)=>det.appendChild(promptItemFull({
    ptype:'shot',owner:ctx.owner,project:ctx.project,batch:ctx.batch,ad:ctx.ad,idx:i,zhItem:it,clipUrl:clipForShot(videos,it,i),
    getEnItem:()=>{const a=_adOf(ctx.batch,ctx.ad);const l=a&&a.sp_en&&a.sp_en.镜头级prompt列表;return l?l[i]:null;}})));
  return det;
}
function buildCommonBody(v,ctx){
  v=v||{};const f=document.createDocumentFragment();
  if(v.商品共性卖点)f.appendChild(tags(v.商品共性卖点));
  ((v.共性镜头prompt列表)||[]).forEach((it,i)=>f.appendChild(promptItemFull({
    ptype:'common',owner:ctx.owner,project:ctx.project,batch:ctx.batch,ad:'common',idx:i,zhItem:it,
    getEnItem:()=>{const b=_res&&_res.batches&&_res.batches[ctx.batch];const l=b&&b.common_en&&b.common_en.共性镜头prompt列表;return l?l[i]:null;}})));
  return f;
}

function renderAdDetail(batch,ad,d,videos){
  const frag=document.createDocumentFragment();const agg=d.agg||{},vp=d.vp||{},sp=d.sp||{};
  if(d.source){const p=document.createElement('div');p.style.margin='4px 0';p.innerHTML='<b>原视频：</b><a href="'+d.source+'" target="_blank" rel="noopener" style="color:var(--accent);word-break:break-all">'+d.source+'</a>';frag.appendChild(p)}
  if(!agg.广告主张&&!vp.video_prompt_text){const p=document.createElement('div');p.className='muted';p.style.marginTop='6px';p.textContent='（仅拆分，尚未分析——点「开始分析本分组」生成卖点/脚本）';frag.appendChild(p)}
  if(videos.length){
    const det=document.createElement('details');det.open=true;
    const sm=document.createElement('summary');sm.textContent='镜头切片（'+videos.length+'）';det.appendChild(sm);
    const w=document.createElement('div');w.className='shots';w.style.marginTop='6px';
    videos.forEach(u=>{
      const cell=document.createElement('div');cell.className='clipcell';
      const v=document.createElement('video');v.src=u;v.preload='metadata';cell.appendChild(v);
      const barc=document.createElement('div');barc.className='clipbar';
      const pb=document.createElement('button');pb.title='播放';pb.textContent='▶';pb.onclick=()=>openClip(u);
      const _cn=(()=>{const f=(u.split('/').pop()||'').split('?')[0];const m=/shot[_-]?(\d+)\.mp4/i.exec(f);const n=m?('_镜头'+String(parseInt(m[1],10)+1).padStart(3,'0')):'';return batch+'_'+ad+n+'.mp4';})();
      const db=document.createElement('button');db.title='下载切片';db.innerHTML=IC.dl;db.dataset.ic=IC.dl;db.onclick=async()=>{await downloadClip(u,_cn);markDone(db);};
      barc.appendChild(pb);barc.appendChild(db);cell.appendChild(barc);
      w.appendChild(cell);});
    det.appendChild(w);frag.appendChild(det);
  }
  const vpctx={owner:(_ctxOwner||_user),project:(_ctxProject||proj()),batch:batch,ad:ad,lang:'zh'};
  if(agg.广告主张||agg.商品卖点||agg.解决痛点){
    frag.appendChild(biBlock(buildAggBox(agg),'en|'+batch+'|'+ad+'|agg',
      ()=>{const a=_adOf(batch,ad);return hasContent(a&&a.agg_en)?a.agg_en:null;},buildAggBox));
  }
  if(vp.video_prompt_text){
    frag.appendChild(biBlock(buildVpBox(vp,vpctx),'en|'+batch+'|'+ad+'|vp',
      ()=>{const a=_adOf(batch,ad);return (a&&a.vp_en&&a.vp_en.video_prompt_text)?a.vp_en:null;},d=>buildVpBox(d,{...vpctx,lang:'en'})));
  }
  if(((sp.镜头级prompt列表)||[]).length){
    frag.appendChild(buildSpBox(sp,{project:proj(),batch:batch,ad:ad},videos));   // 每条镜头prompt自带中/EN与收藏
  }
  return frag;
}

function renderCommon(v,batch){
  const c=document.createElement('div');c.className='card';
  const list=v.共性镜头prompt列表||[];
  c.style.position='relative';
  c.innerHTML='<h2>品类共性镜头库 · '+(v.品类||'')+' <span class="muted" style="font-weight:400">（'+list.length+' 条 · 本批次归纳）</span></h2>';
  const dc=document.createElement('button');dc.className='mini dlbtn';dc.title='下载共性(json)';dc.innerHTML=IC.dl;dc.dataset.ic=IC.dl;
  dc.style.cssText='position:absolute;top:16px;right:16px';dc.onclick=()=>{downloadObj(v,(batch?batch+'_':'')+'共性镜头prompt.json');markDone(dc);};c.appendChild(dc);
  c.appendChild(buildCommonBody(v,{owner:(_ctxOwner||_user),project:(_ctxProject||proj()),batch:batch,ad:'common'}));   // 每条共性prompt自带中/EN与收藏
  return c;
}

// 初始化：放在所有声明之后，避免 TDZ（wireDrawer 内含 measureHdr）
wireDrawer();wireDrop();_drawerMode='all';renderDrawer();openDrawer();
bootAuth();   // 登录门：有有效 token 自动进入，否则显示登录页
</script>
