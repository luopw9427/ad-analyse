<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>提示词编辑</title>
<style>
  :root{--bg:#eef2f8;--panel:#fff;--panel-2:#f7f9fc;--ink:#1b2431;--sub:#5a6678;--muted:#9aa6b6;
        --line:#e7ecf3;--line-2:#dde4ee;--accent:#2f6bed;--accent-ink:#1e51c4;--accent-weak:#eaf1fe;
        --ok:#15a34a;--ok-bg:#e9f7ee;--warn:#c0561f;--warn-bg:#fbeee4;--r:14px;--r-sm:9px}
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,#eef2f8,#e9eef6);color:var(--ink);
       font-family:-apple-system,"Segoe UI",system-ui,"Microsoft YaHei",sans-serif;font-size:14px}
  header{padding:14px 28px;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);
         border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:5}
  header h1{font-size:16px;margin:0 10px 0 0;font-weight:700}
  button{background:var(--accent);border:0;color:#fff;padding:8px 14px;border-radius:var(--r-sm);cursor:pointer;font-size:13px;font-weight:600}
  button:hover{background:var(--accent-ink)}
  button.ghost{background:#fff;border:1px solid var(--line-2);color:var(--sub);font-weight:500}
  button.ghost:hover{background:var(--panel-2);border-color:var(--accent);color:var(--accent)}
  button.mini{padding:4px 10px;font-size:12px}
  main{padding:22px 28px 80px;max-width:1000px;margin:0 auto}
  .intro{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 18px;margin-bottom:16px;color:var(--sub);line-height:1.7}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(16,24,40,.04),0 6px 18px rgba(16,24,40,.05)}
  .card h2{font-size:15px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
  .card h2::before{content:"";width:4px;height:15px;border-radius:3px;background:linear-gradient(180deg,#2f6bed,#5a52d8)}
  .desc{color:var(--muted);font-size:12.5px;margin:0 0 10px}
  .vars{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  .vars .lab{color:var(--sub);font-size:12px}
  .chip{background:var(--warn-bg);border:1px solid #f0c9bb;color:var(--warn);border-radius:6px;padding:2px 8px;font-size:11.5px;font-family:Consolas,monospace}
  .editor{width:100%;min-height:220px;max-height:560px;overflow:auto;white-space:pre-wrap;word-break:break-word;
          background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:12px;
          font-size:12.5px;line-height:1.7;color:#2c3644;font-family:Consolas,"Microsoft YaHei",monospace;outline:none}
  .editor:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
  .editor .ph{background:var(--warn-bg);border:1px solid #f0c9bb;color:var(--warn);border-radius:5px;
              padding:0 4px;font-family:Consolas,monospace;white-space:nowrap;cursor:not-allowed}
  .row{display:flex;gap:10px;align-items:center;margin-top:10px}
  .st{font-size:12px}
  .st.ok{color:var(--ok)} .st.err{color:var(--warn)}
  .muted{color:var(--muted)}
</style>
</head>
<body>
<header>
  <button class="ghost" onclick="location.href='/'">← 返回主页</button>
  <h1>提示词编辑</h1>
  <button onclick="saveAll()">全部保存</button>
  <button class="ghost" onclick="resetAll()">全部恢复默认</button>
  <span id="status" class="muted"></span>
</header>
<main>
  <div class="intro">
    这里可自定义每个分析环节的提示词。修改<b>只保存在本机浏览器</b>，以后在这台电脑跑分析就会注入你改过的版本；换电脑/清缓存则恢复默认。<br>
    每个环节标注了<span class="chip">必需占位符</span>——它们是函数往提示词里塞数据的口子（尤其 <code>{schema_json}</code> 是输出格式），<b>删了会导致该环节回退默认</b>，所以保存前会校验。其余文字随便改。
  </div>
  <div id="list" class="muted">加载中…</div>
</main>

<script>
const $=s=>document.querySelector(s);
let DEF={};                       // 默认 {key:{label,desc,required,content}}
let OV={};                        // 本机覆盖 {key:text}
try{OV=JSON.parse(localStorage.getItem('customPrompts')||'{}')}catch(e){OV={}}

function hasVar(text,name){return new RegExp('\\{'+name+'(\\}|:|!)').test(text)}
function buildEditor(el,text){
  el.innerHTML='';const re=/\{[^{}]*\}/g;let last=0,m;
  while((m=re.exec(text))){
    if(m.index>last)el.appendChild(document.createTextNode(text.slice(last,m.index)));
    const sp=document.createElement('span');sp.className='ph';sp.contentEditable='false';sp.textContent=m[0];
    el.appendChild(sp);last=m.index+m[0].length;
  }
  if(last<text.length)el.appendChild(document.createTextNode(text.slice(last)));
}
function readEditor(el){
  let out='';el.childNodes.forEach(n=>{
    if(n.nodeType===3)out+=n.data;
    else if(n.nodeType===1){
      if(n.classList&&n.classList.contains('ph'))out+=n.textContent;
      else if(n.tagName==='BR')out+='\n';
      else out+=n.textContent;
    }
  });return out;
}
function wireEditor(el){
  el.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();document.execCommand('insertText',false,'\n')}});
  el.addEventListener('paste',e=>{e.preventDefault();const t=(e.clipboardData||window.clipboardData).getData('text');document.execCommand('insertText',false,t)});
}
function missingVars(key,text){return (DEF[key].required||[]).filter(v=>!hasVar(text,v))}
function setStatus(t){$('#status').textContent=t||''}

async function load(){
  try{const r=await fetch('/prompts/defaults');DEF=await r.json();}
  catch(e){$('#list').innerHTML='加载默认提示词失败：'+e.message;return}
  const root=$('#list');root.innerHTML='';
  Object.keys(DEF).forEach(key=>{
    const d=DEF[key];
    const c=document.createElement('div');c.className='card';
    c.innerHTML='<h2>'+d.label+' <span class="muted" style="font-weight:400;font-size:12px">'+key+'</span></h2>'
      +'<div class="desc">'+(d.desc||'')+'</div>';
    const vars=document.createElement('div');vars.className='vars';
    vars.innerHTML='<span class="lab">必需占位符（不可删）：</span>'+(d.required||[]).map(v=>'<span class="chip">{'+v+'}</span>').join('');
    c.appendChild(vars);
    const ta=document.createElement('div');ta.id='ta_'+key;ta.className='editor';ta.contentEditable='true';
    buildEditor(ta,(OV[key]!=null?OV[key]:d.content));wireEditor(ta);c.appendChild(ta);
    const row=document.createElement('div');row.className='row';
    const bs=document.createElement('button');bs.className='mini';bs.textContent='保存这一条';bs.onclick=()=>saveOne(key);
    const br=document.createElement('button');br.className='mini ghost';br.textContent='恢复默认';br.onclick=()=>resetOne(key);
    const st=document.createElement('span');st.className='st';st.id='st_'+key;
    if(OV[key]!=null){st.textContent='● 已自定义';st.className='st ok'}
    row.appendChild(bs);row.appendChild(br);row.appendChild(st);c.appendChild(row);
    root.appendChild(c);
  });
}

function saveOne(key){
  const st=$('#st_'+key);const text=readEditor($('#ta_'+key));
  const miss=missingVars(key,text);
  if(miss.length){st.className='st err';st.textContent='✗ 缺少占位符：'+miss.map(v=>'{'+v+'}').join(' ')+' —— 未保存';return false}
  if(text===DEF[key].content){delete OV[key];st.className='st';st.textContent='（与默认一致，用默认）'}
  else{OV[key]=text;st.className='st ok';st.textContent='✓ 已保存（本机）'}
  localStorage.setItem('customPrompts',JSON.stringify(OV));
  return true;
}
function resetOne(key){
  buildEditor($('#ta_'+key),DEF[key].content);delete OV[key];
  localStorage.setItem('customPrompts',JSON.stringify(OV));
  const st=$('#st_'+key);st.className='st';st.textContent='已恢复默认';
}
function saveAll(){
  let ok=0,err=0;Object.keys(DEF).forEach(k=>{saveOne(k)?ok++:err++});
  setStatus('保存完成：成功 '+ok+'，失败 '+err+(err?'（有环节缺占位符，见下方红字）':''));
}
function resetAll(){
  if(!confirm('把所有环节恢复为默认提示词？会清除本机自定义。'))return;
  OV={};localStorage.setItem('customPrompts','{}');load();setStatus('已全部恢复默认');
}
load();
</script>
</body>
</html>
